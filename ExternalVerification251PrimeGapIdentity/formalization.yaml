version: "v0.4"

project:
  name: "Erdős #251: unconditional prime-gap reformulation of the dyadic prime series"
  description: >-
    Seven declarations are compared and every one of them is unconditional.
    Write p_n for the (n+1)st prime in the zero-based enumeration and
    g_n = p_(n+1) - p_n for the consecutive prime gap. The displayed series of
    Erdős Problem 251 satisfies the exact identity
    sum_(n>=0) p_n / 2^n = 4 + 2 * sum_(n>=0) g_n / 2^(n+1), and it is
    irrational if and only if the prime-gap series sum_(n>=0) g_n / 2^(n+1) is
    irrational. The normalized series satisfies the corresponding exact
    identity sum_(n>=0) p_n / 2^(n+1) = 2 + sum_(n>=0) g_n / 2^(n+1) and
    carries the same irrationality equivalence. The prime series
    sum_(n>=0) p_n / 2^(n+1) and the prime-gap series sum_(n>=0) g_n / 2^(n+1)
    are both summable. Convergence rests on the explicit elementary bound
    p_n <= 1250 * (n+1)^4, which is proved here from a central binomial
    coefficient estimate for the prime counting function and is compared as a
    declaration in its own right. The identities come from finite summation by
    parts over the dyadic weights followed by a passage to the limit that uses
    the summability proved in the same package, so the two series differ by an
    explicit rational affine change of variable. Every declaration is a
    reformulation of the target. No declaration asserts irrationality of the
    displayed series, of the normalized series, or of the prime-gap series, so
    Erdős Problem 251 is untouched and the remaining problem is to prove
    irrationality of the prime-gap series. This theorem family is the first
    presentation recorded in the development and its novelty is unassessed.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

