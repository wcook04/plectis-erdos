version: "v0.4"

project:
  name: "Erdős #251: a finite-truncation escape criterion for the prime-gap dyadic series"
  description: >-
    A cofinal supply of finite prime-gap blocks whose signed dyadic window lies farther
    from the integers than an explicit majorant tail mass forces every fixed positive shift
    of the complete real prime-gap tail to be non-integral cofinally, and hence forces the
    prime dyadic series to be irrational. The omitted part of each shift is identified
    exactly as the later complete shift scaled by a power of two rather than estimated away,
    and summability of the majorant remainder is required only at the configurations the
    supply names. The readers are analytic number theorists working on irrationality of
    prime-indexed dyadic series. The supply hypothesis is not proved for the actual prime
    gaps and is exactly the open input, so this is a conditional criterion and it does not
    settle Erdős Problem 251.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

