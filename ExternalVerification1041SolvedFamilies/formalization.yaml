project:
  name: "Erdős #1041: checked kernels for three completely solved polynomial families"
  description: >-
    The accompanying ordinary mathematics completely solves three structured families of
    Erdős #1041: collinear root configurations in every degree, the primitive sparse
    quintics, and translated cubic quotient fibres in every degree 3q with q at least two.
    This configuration verifies in Lean the three load-bearing kernels of those solutions,
    and only those three. For every degree n at least two, a monic polynomial of degree n
    vanishing at -1 and 1, with n-1 increasing interior nodes in the closed interval and
    values alternating in sign along them, has one node at which the absolute value is at
    most 2^-(n-1) times cos(pi/2n)^-n. Five real disk coordinates satisfying the first three
    rotated Newton moments for r strictly between 0 and 2 contain two distinct indices whose
    tail energy is strictly below one, and three roots in the open unit disc admit one
    complete radial spoke along which their monic cubic stays inside the closed unit
    lemniscate. Each family solution is reduced to a single finite inequality, so the
    delicate step in the geometry of polynomial sublevel sets is the part submitted for
    checking. The alternation argument sits in the classical Chebyshev context, a bounded
    search found no earlier form of the quintic selector, and priority is unresolved. Affine
    transport, the final selection, and the surrounding analytic assembly are ordinary
    proofs rather than Lean-checked conclusions, and the unrestricted problem is untouched.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

