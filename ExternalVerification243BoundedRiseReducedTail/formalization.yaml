version: "v0.4"

project:
  name: "Erdős #243: exclusion of bounded-rise reduced tails"
  description: >-
    No exact reduced tail arising from the rational case of Erdős Problem 243 rises slowly
    forever. Fix an index N and a positive bound B. If the multipliers satisfy a n > 1 from N
    onward, the states are reduced with gcd(u n, v n) = 1 from N onward, the exact recurrences
    u(n+1) + v n = a n u n and v(n+1) = a n v n hold from N onward, and every upward increment
    obeys u(n+1) <= u n + B from N onward, then the numerator sequence u tending to infinity is
    contradictory. Coprimality of u n and v n is definitional for a reduced tail, so the
    exclusion applies to the actual reduced tail at every offset and every uniform bound. A
    second theorem states the unshifted case N = 0 with the same conclusion. The third theorem
    is the general barrier that both reduced-tail statements specialise: for a natural sequence
    u tending to infinity and a modulus family m with m n > 1 from N onward, with m i and m j
    coprime at distinct indices i, j at least N, and with m i coprime to u t at every pair
    N <= i < t, a uniform upward increment bound u(n+1) <= u n + B from N onward is
    contradictory. That statement is written in Mathlib vocabulary alone, using Nat.Coprime and
    Filter.Tendsto, and carries an explicit uniform constant B with no project definition. The
    mechanism takes the B moduli m N through m (N + B - 1), builds by the Chinese remainder
    theorem a shifted block of B consecutive integers x, x + 1, ..., x + B - 1 with the i-th
    divisible by m (N + i) and with x strictly above the value of u at index N + B, and then
    takes the first index at which u reaches x + B. At every index from N + B onward each value
    in the window from x to x + B is divisible by one of the selected moduli while whole-modulus
    avoidance makes it coprime to that same modulus, so the window is unreachable there; the
    predecessor of the first crossing therefore lies below x, and the increment bound puts the
    crossing value below x + B. The ingredients are the Chinese remainder theorem, coprimality
    bookkeeping and a first-crossing argument. The avoidance hypothesis is required at every
    index later than the modulus index, the increment bound is uniform over the whole tail, and
    the divergence of u is assumed here. No theorem in this package produces those hypotheses
    from the reciprocal series, no theorem forces the Sylvester recurrence
    a(n+1) = a n^2 - a n + 1, and Erdős Problem 243 remains open.
  authors:
    - "Will Cook"
  responsible_maintainers:
    - "Will Cook"
  license: "Apache-2.0"

