version: "v0.4"
project:
  name: "Erdős #1049: no coordinatewise denominator clearing at the rational base 3/2"
  description: >-
    At the rational base 3/2 the coordinatewise clearing corridor is impossible for every
    window length N ≥ 1, every shift K ≥ 1, and every choice of cleared denominator Q and
    divisor coefficient. The corridor is the direct transfer of the integer-base argument,
    in which one clears the K-th coordinate and then forces the positive remaining tail
    below one, and its two halves are incompatible at 3/2: the divisibility 3^K | Q digit
    with digit ≤ N + K caps 3^K by Q(N+K), while the tail inequality Q 2^(N+K+1) < 3^(K+1)
    demands the reverse, so an exponential quantity would have to sit below a linear one.
    Behind the exclusion is an exact identity: the denominator-cleared tail state B r^N (F -
    prefix_N) satisfies T_(N+1) = r T_N - B coeff(N+1) s^(N+1) for every nonzero r, so the
    whole corridor is governed by one forcing term. That term carries the factor s^(N+1),
    which is 1 at an integer base and is at least 2^(N+1) at every genuine rational base s ≥
    2 with B ≥ 1 and positive coefficients, which is the exact reason the classical corridor
    survives integer bases and dies at 3/2. For work on irrationality of Lambert-type series
    at rational bases, the consequence is that the entire literal coordinatewise-clearing
    corridor is eliminated, and any successful method must exploit cancellation inside the
    tail state or global structure that no single coordinate sees; priority for this
    exclusion is unassessed. Deriving the cleared state from rationality of the Lambert
    value at 3/2, excluding other linear-form constructions, and irrationality at 3/2 remain
    open.
  authors: ["Will Cook"]
