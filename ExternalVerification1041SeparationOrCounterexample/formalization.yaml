project:
  name: "Erdős #1041: separation-or counterexample"
  description: >-
    This directory isolates the displayed counterexample proposition of the
    short note: an explicit monic cubic with all zeros in the open unit disc,
    two simple critical points, least critical modulus above 13/25, critical
    values on distinct positive rays, and normalised critical-value separation
    strictly below 2/375. It refutes a covering reading of a separation
    criterion and makes no claim about the parent problem.
