version: "v0.4"

project:
  name: "Erdős #257: rational values force unbounded integer tail orbits and mass lower bounds"
  description: >-
    Write S(A) for the sum of 1/(2^a - 1) over the elements a of A, and write d_A(n)
    for the number of divisors of n that lie in A. Four declarations are compared, and
    each is conditional on a hypothetical rational value of S(A). The strongest assumes
    A infinite, v positive, and S(A) = p/(2^c v). It produces a sequence u of natural
    numbers with u(n) equal to v times the binary tail of d_A from index c + n, with
    u(n) strictly positive at every n, with the exact recurrence
    u(n+1) + v d_A(c+n+1) = 2 u(n), with the residue law u(n) congruent to p 2^n modulo
    v, and with u exceeding every natural bound. The second assumes that A contains a
    positive element, that v is positive, and that S(A) = p/(2^c v). For every eps > 0
    it produces a constant B at least zero such that every zero window of d_A beginning
    at c + N of length h satisfies h <= eps log_2(N+1) + B. The infinitude of A is
    absent from its hypotheses. The third assumes that A contains a positive element,
    that the reciprocal support terms of A are summable, that v is odd and exceeds one,
    that p and v are coprime, and that S(A) = p/(2^c v). It bounds the reciprocal mass
    of A below by the reciprocal of the multiplicative order of 2 modulo v. It carries
    no infinitude assumption, so it is a mass bound that applies to finite supports. The
    fourth assumes A infinite and S(A) = p/2^c. It concludes that the reciprocal support
    terms of A fail to be summable or that the reciprocal mass of A exceeds one. One
    mechanism carries all four. The divisor-counting coefficients d_A are the binary
    coefficients of S(A), so clearing the denominator turns a rational value into a
    positive integer orbit under doubling, and each declaration measures how often the
    support must fire to keep that orbit positive. These are support-uniform necessary
    conditions imposed with no density or regularity assumption on A. They exclude no
    rational value of S(A), and Erdős #257 remains open. Novelty is unassessed.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

