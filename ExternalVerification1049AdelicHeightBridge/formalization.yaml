version: "v0.4"

project:
  name: "Erdős #1049: exact first transformed Zudilin row and the 2^64 < 3^41 < 2^65 bracket"
  description: >-
    In every column l, the first transformed normalised Zudilin row v*_(l+1) - v*_l has
    order exactly l+1 and coefficient exactly -6 at that order. The two-sided integer
    certificate 2^64 < 3^41 < 2^65 is exact, 65 cannot be replaced by 64, and every constant
    below descends from it. Uniformly over the entire admissible rectangular Hermite–Padé
    exponent cone, meaning every rho ≥ 0 and every sigma ≥ 1 + rho, the achievable threshold
    stays more than 3/13 below log 2 / log 3, so no exponent choice in that cone buys enough
    decay for the coefficient growth it pays. The cubic Hankel determinant accumulates a raw
    denominator power 4N^3 - 3N^2, of which more than 39/41 must be cleared because the
    surviving charge threshold (log 3 / log 2 - 1)/3 lies below 8/41, and three natural
    producers fail that requirement for every admissible N: the source scalar content of
    degree at most N^3 - N, the scalar content together with the universally forced
    first-order residual border of combined degree at most 2N^3 - N, and the positive scalar
    ray C1 ≥ 2 C0, which misses by the fixed relative margin 17/41. At bottom depth 41T any
    130T + 2S binary forms contain two distinct selectors with the same four-jet signature,
    130 is exactly optimal at T = 1 since 2^(129 + 2S) is strictly below the number of
    signatures, and a general bounded-fibre pigeonhole converts such a collision into an
    escape from the remainder nullspace whenever equal remainders occur with multiplicity at
    most k and the signature count times k is below the number of selectors. For anyone
    building Hermite–Padé or q-Apéry approximations to the Lambert value at 3/2, the
    consequence is that a successful family must carry cancellation absent from the scalar
    and border models, and that reaching the nullspace escape by this counting route needs
    at least 130 + 2S forms at bottom depth 41; the ancestry is the classical rectangular
    Hermite–Padé threshold, and priority for these certificates is unassessed. Transformed
    rows j ≥ 2, the all-rank normalised-Hankel order and leading-coefficient theorem, the
    construction of an approximation family, a remainder-fibre bound for one, analytic
    decay, and irrationality at 3/2 remain open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

