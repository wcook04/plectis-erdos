version: v0.4
project:
  name: 'Erdős #68: remote factorial-grid kernels reduced by an exact prime unit translator'
  description: 'For every cutoff n and every support threshold B there exist a prime
    p and an integer z such that the Cramer coefficient vector on the factorial grid
    of indices (B + 1 + j) * ((n+2)!)^2 for j < n + 2, enlarged by z times the prime
    pair (p, -1) on the indices (p - 1, p), has every support index above B, has zero
    channel numerator at every d with 2 ≤ d ≤ n + 2, has nonzero factorial moment,
    and has channel residual beyond n + 2 of absolute value at most 1/2. That statement
    is unconditional and quantified over both the cutoff and the threshold. A channel
    is an index d at least 2 carrying the modulus d! - 1; the channel numerator at
    d reweights each factorial term by the powers of d! that divide out, and the channel
    residual beyond a cutoff D sums the numerator at d divided by d! - 1 over all d
    greater than D. The prime pair supplying the reduction is pinned by four exact
    facts, each stated under the hypotheses its proof uses: the factorial moment of
    the pair vanishes for every positive p, the channel numerator vanishes at every
    d with 2 ≤ d < p for prime p, the channel numerator vanishes at every d greater
    than p for every positive p, and the channel numerator at p equals p! - 1 for prime
    p. Together with 2 ≤ D < p and p prime these give a residual of exactly 1 beyond
    D, so appending z copies of the pair to any finite-support coefficient vector adds
    exactly z to its residual beyond D. This theorem family is the first presentation
    recorded in the development and its novelty is unassessed. The residual bound 1/2
    is non-strict and the reduced residual may be zero. No declaration here proves
    that the un-translated residual avoids the integers, bounds the size of the Cramer
    coefficients, or proves irrationality of the factorial-gap series, so the irrationality
    question in Erdős Problem 68 is untouched, and the remaining problem is to supply
    a nonintegrality certificate for the un-translated residual.'
