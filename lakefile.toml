name = "erdos249257"
version = "0.6.0"
keywords = ["math", "erdos249", "erdos257", "lean4", "mathlib", "formalized-mathematics"]
defaultTargets = ["Erdos249257"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Erdos249257"

# Problem-centric statements, built on the shared machinery in Erdos249257.
# Not a default target, for the same reason Examples is not: a downstream
# consumer running `lake build` should get exactly the one library it depends
# on. CI builds this explicitly with `lake build ErdosProblems`.
[[lean_lib]]
name = "ErdosProblems"

# Downstream consumer example (examples/Examples.lean). Not a default target:
# CI builds it explicitly with `lake build Examples` after the library.
[[lean_lib]]
name = "Examples"
srcDir = "examples"
