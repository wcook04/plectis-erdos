  location: ErdosProblems/Erdos1041/PaperCubicMonic.lean
  declaration: ErdosProblems.Erdos1041.PaperCubicMonic.monic_cubic_connector
  relationship: other
- title: Complete cubic polygonal connector
  location: ErdosProblems/Erdos1041/PaperCubicCompletion.lean
