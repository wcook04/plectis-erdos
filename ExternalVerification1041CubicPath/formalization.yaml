version: v0.4
project:
  name: A short polygonal connector for cubic roots in the open unit disc
  description: For p equal to the product of three linear factors with all three listed
    roots in the open unit disc, two distinct root indices admit an explicit two-segment
    hub path contained in the open unit lemniscate, with actual extended variation
    less than two. The path is continuous and of bounded variation. Squarefreeness
    guarantees distinct endpoint values; repeated-root indices may give a constant
    path. No general-degree claim is made.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
