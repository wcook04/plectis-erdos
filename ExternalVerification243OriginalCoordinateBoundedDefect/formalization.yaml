# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #243: the Sylvester recurrence from a bounded original-coordinate product defect"
  description: >-
    Conditional theorem in the original coordinates of the problem. A strictly
    increasing sequence of positive integers whose reciprocal series has a
    rational value, whose growth satisfies a(n+1)/a(n)^2 to 1, and whose product
    defect P(n)/a(n) * (a(n)^2/a(n+1) - 1) is bounded above from some index
    onward satisfies a(n+1) = a(n)^2 - a(n) + 1 eventually. The integer state,
    its positivity, the exact recurrences and normalised vanishing are all
    derived from the rational sum and the growth hypothesis, not assumed. The
    bound on the product defect is the standing hypothesis, and Erdos #243
    remains open without it.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

