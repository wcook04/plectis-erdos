# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #1049: rational-base Lambert-series height certificate"
  description: >-
    A Lean-checked exact certificate that log(2)/log(7) is below the
    Bundschuh--Väänänen height threshold for the rational base 7/2. The
    certificate formalizes only this numerical entrance inequality; the
    cited analytic irrationality theorem and the open 3/2 and general
    rational-base questions remain external or unresolved. It is intended as
    a compact audit object for researchers studying rational-base Lambert
    series and Diophantine approximation who need to separate a checkable
    height condition from the analytic theorem that consumes it. Because it
    records only this elementary entrance condition, it is a subordinate
    Comparator audit fixture rather than a standalone Palomar research claim.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

palomar_qualification:
  status: "not_ready_for_submission"
  selected_project: "formal_math/erdos257_period_noncollapse"
  comparator_config: "formal_math/erdos257_period_noncollapse/comparator.json"
  repository_scope: "complete_checked_out_repository"
  repository_size: "current_monorepo_exceeds_500_MiB_limit"
  replay_status: "terminal_positive_and_deliberate_negative_pair_pending_supported_runner"
  research_interest_status: "operator_review_required"
  note: >-
    The selected project and its one-entry Comparator configuration are
    prepared, but the enclosing repository is not currently eligible under
    the complete-checkout size rule. A supported runner must still produce
    both terminal replay results, and Palomar's separate research-interest
    decision remains outside this metadata.

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J72"]

sources:
  - title: "Arithmetical investigations of a certain infinite product"
    authors:
      - "Peter Bundschuh"
      - "Keijo Väänänen"
    id: "https://numdam.org/item/CM_1994__91_2_175_0.pdf"
    type: "paper"
    location: "Compositio Mathematica 91 (1994), 175--199; Theorem 2 on printed p. 177 (PDF p. 4)"
    relationship: "adapts"
    note: >-
      The Lean development adapts the published 7/2 height admission
      inequality only. Bundschuh--Väänänen's analytic theorem, inherited
      hypotheses, and irrationality implication are not formalized here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Mathlib"
    authors:
      - "The mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    relationship: "background"
    license: "Apache-2.0"
    author_endorsement: "n/a"

status:
  scope: >-
    The compared result is the exact inequality
    log(2)/log(7) < 1/2 - 1/pi^2. Lean checks the integer-power certificate,
    logarithmic monotonicity, pi margin, and membership in the local height
    predicate. Challenge.lean contains the deliberate Comparator specification
    sorry; the sorry counts above exclude that statement and describe the
    proof development in Solution.lean. It does not formalize the
    Bundschuh--Väänänen analytic theorem,
    claim irrationality at 7/2, or address the open base 3/2 problem.
  sorry_count: 0
  sorry_in_definitions: 0
  proof_corpus_sorry_count: 0
  trusted_challenge_sorry_count: 1
  sorry_boundary: >-
    The only deliberate placeholder is the trusted proposition package in
    ExternalVerification1049/Challenge.lean. It is excluded from the proof
    corpus sorry_count by the formalization.yaml v0.4 schema; the
    proof-bearing Solution.lean and its source proof have sorry_count 0.
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "Erdos249257.ExternalVerification1049.comparator_sevenHalves_numericalHeight"
      file: "ExternalVerification1049/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
      canonical_claim_status: "subordinate_comparator_audit_fixture_not_standalone_palomar_claim"
      local_proof_provenance: "proved_in_this_repository"
      novelty_status: "unassessed_no_priority_claim"
      contribution_class: "locally proved numerical certificate; novelty unassessed"
      statement: >-
        The rational-base 7/2 logarithmic ratio satisfies the strict height
        inequality log(2)/log(7) < 1/2 - 1/pi^2.
      boundary: >-
        This is the elementary numerical entrance condition only; it does not
        formalize the cited analytic theorem, prove irrationality at 7/2, or
        solve Erdős Problem 1049.
      comparator_declaration: "Erdos249257.ExternalVerification1049.comparator_sevenHalves_numericalHeight"
      literature_dependencies:
        - statement: >-
            Bundschuh--Väänänen's published height theorem supplies the
            external analytic context and is not formalized here.
          source: "Arithmetical investigations of a certain infinite product"

automation:
  methods:
    - method: "manual"
      models: []
      framework: "Source and claim-boundary review"
      tool_setup: "Human-authored provenance, scope, and limitation review"
    - method: "agent"
      models:
        - "OpenAI Codex"
      framework: "Lean 4 and Mathlib"
      tool_setup: "AI-assisted proof engineering with focused lake builds and statement-isolated Comparator fixtures"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
        prompting_notes: "n/a"
    - method: "other"
      models: []
      framework: "Comparator with NanoDa and Landrun"
      tool_setup: >-
        Pinned cold replay through scripts/verify-comparator.sh, including
        exact positive acceptance and deliberate-negative mismatch rejection
        behind the required systemd boundary.
    - method: "other"
      models: []
      framework: "Lean kernel"
      tool_setup: "lake env lean with pinned lake-manifest.json and lean-toolchain"
  notes: >-
    Human-authored source attribution and claim-boundary review remain
    separate from kernel checking and Comparator preparation. The package-root
    scripts/verify-comparator.sh is the supported cold-replay actuator: it
    bootstraps the pinned Comparator, Landrun, NanoDa, and v4.29.1-matched
    lean4export before running the canonical positive configuration and the
    deliberate-negative mismatch. The checked-in
    ErdosProblems/Erdos1049/scripts/run_comparator_replay.py remains the
    bounded local diagnostic actuator; it reports an unavailable execution
    environment rather than manufacturing a Comparator verdict when the
    required Linux systemd boundary is absent.

fidelity:
  divergences: >-
    This project formalizes the elementary numerical threshold condition only.
    The cited paper supplies the analytic theorem and its remaining hypotheses;
    no end-to-end irrationality proof is claimed.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The Challenge/Solution declaration identity and the source-to-predicate
    boundary were inspected locally. No human mathematical peer review or
    Palomar decision is claimed.

alignment:
  namespace: "Erdos249257.ExternalVerification1049"
  statements:
    - source: "The 7/2 specialization satisfies the published height inequality."
      lean: "Erdos249257.ExternalVerification1049.comparator_sevenHalves_numericalHeight"
      module: "ExternalVerification1049/Challenge.lean"
      status: "adapted"
      note: >-
        The compared declaration is a transparent numerical inequality. Its
        proof transports the local certificate from
        ErdosProblems.Erdos1049.RationalBaseLambert; the external analytic
        implication remains outside the declaration.

acknowledgements: "Mathlib contributors; Bundschuh and Väänänen for the cited source."
