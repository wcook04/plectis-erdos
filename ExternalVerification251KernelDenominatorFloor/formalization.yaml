version: v0.4
project:
  name: 'Erdős #251: kernel-decided denominator floor for the prime-gap dyadic series'
  description: >-
    Every rational a/b equal to the prime-gap series of Erdős Problem 251, the dyadic series
    whose term at index n is (p_(n+1) - p_n)/2^(n+1), has denominator b at least 2^589, a number
    exceeding 10^177. The same floor holds for the zero-based prime series with term
    p_n/2^(n+1), whose value is 2 more than the gap series. Both floors are decided inside the
    Lean kernel. certCheck c u v u' v' X packages six integer conditions on a trial-division
    sieve run over every m < X: the count of primes below X equals c, v and v' are positive, the
    Farey determinant u'v = uv' + 1 holds, and two inequalities place the prime series strictly
    inside the interval from u/v to u'/v'. den_bound_of_certCheck converts a passing certificate
    at any truncation index c at least 9 into the bound v + v' <= b for every rational a/b equal
    to the prime series, with the omitted tail controlled by 5000(c+1)^4/2^(c+1). cert_10000
    discharges that certificate at c = 1229 and X = 10000 on four explicit constants of 177 and
    178 digits by kernel evaluation, and the sum v + v' of the two recorded denominators is at
    least 2^589. A lower bound on the denominator of a rational representation is compatible
    with rationality of either series. The package supplies no irrationality theorem and Erdős
    Problem 251 is not decided here.
