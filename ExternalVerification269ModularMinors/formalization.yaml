version: "v0.4"

project:
  name: "Erdős #269: admissible modular minors at every order"
  description: >-
    At the three prime generators 2, 3 and 5, attach to an exponent vector the inverse of
    the running-LCM height of the corresponding smooth number. For every order n there is
    one pair of injective index maps that works simultaneously over the rationals and over
    every admissible residue ring: the rational minor is nonzero at every layer, and for
    every modulus B at least two and coprime to 30, and every layer, the reduced minor is a
    unit and the reduced matrix is invertible. The index maps are selected before both the
    modulus and the layer, which is what makes this a statement about a single selection
    rather than a family of selections depending on the modulus. The proof factors the
    kernel as a diagonal row unit, a carry staircase, and a diagonal column unit, and
    computes the staircase determinant as a unit in any commutative ring where 2, 3 and 5
    are units; admissibility is exactly that condition on the residue ring. Reduction is
    the inverse of the natural height inside the residue ring, so no ring map from the
    rationals is used or needed. The readers are number theorists reading the Erdős 269
    note; the statement is a rank and invertibility result and carries no irrationality
    content.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

