version: v0.4
project:
  name: 'Erdős #1041: uniform disk-family critical-value separation thresholds and
    a sign-free connector-length bound'
  description: 'Write C(n, S, p) = (S / (n - 1))^(2/n) log((S^2 + S + p) / (S^2 -
    S + p)) for the squared-length coefficient of the disk-family critical-value separation
    bound, in which n is the degree, S is the separation radius measured from a real
    centre w0 of the unit value segment, and p = w0 (1 - w0) is the centre parameter.
    Five declarations are compared. The strongest is uniform in all three parameters:
    for every integer n at least 3, every real S with 4/3 at most S and S at most
    2, and every real p at least 0, C(n, S, p) < 2. Composed with the numerical consumer
    this gives the connector statement: for every integer n at least 3, every real
    S with 4/3 at most S and S at most 2, every real p at least 0, and every real
    length whose square is at most 2 C(n, S, p), the length is strictly below 2. The
    consumer is compared on its own and holds for every n, S and p: length squared
    at most 2 C(n, S, p) together with C(n, S, p) < 2 gives length strictly below
    2, with no sign hypothesis on the length. Two specializations are compared separately.
    The branch-centred radius-two regime C(n, 2, 0) < 2 holds for every integer n
    at least 3. The degree-three regime C(3, 6/5, 0) < 2 holds. The mechanism inside
    the uniform proof is that the radial factor (S / (n - 1))^(2/n) lies in (0, 1]
    once 0 < S and S at most n - 1, which holds throughout the stated range since
    n at least 3 and S at most 2, that the centre parameter only lowers the logarithmic
    ratio, so (S^2 + S + p) / (S^2 - S + p) is at most (S + 1) / (S - 1) for S greater
    than 1 and p at least 0, that (S + 1) / (S - 1) is at most 7 once S is at least
    4/3, and that log 7 < 2 by the nine-digit lower bound on e. The degree-three case
    evaluates the logarithmic ratio at 11 exactly, bounds (3/5)^(2/3) by 18/25 by
    cubing, and bounds log 11 below 5/2. The audience is complex analysts working
    on lemniscate connectivity and the geometry of polynomial sublevel sets. Priority
    for these coefficient thresholds is unassessed. The analytic continuation of the
    square-resolved inverse branch, its univalence, the Bergman segment inequality,
    Pólya''s area-capacity inequality, and the exterior-fibre capacity gap that together
    produce the squared connector bound are ordinary proofs in the companion note.
    Lean checks none of them. The squared bound enters both consumer declarations as
    an explicit hypothesis, and no declaration here constructs it for any polynomial.
    The companion note records Dubinin, Some inequalities for polynomials and rational
    functions associated with lemniscates, Journal of Mathematical Sciences 193 (2013)
    45 to 54, Theorem 1, as a relative Pólya inequality standing behind the area input,
    with the full text unobtained. Erdős Problem 1041 is not decided here.'
