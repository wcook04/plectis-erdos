sources:
  - title: "Protected-epoch record energy from reusable odd-prime barriers"
    authors:
      - "Will Cook"
    type: "original-proof"
    relationship: "other"
    note: >-
      One protected odd prime power is charged against the whole family of odd
      multiples of the prime inside a fixed dyadic window, of which there are at
      least an eighth of the prime power. The three ingredients are a barrier
      count, a per-step capacity bound from the spacing of barriers first crossed
      at the same step, and a per-barrier clean-record argument in which
      persistence of the prime power kills the exact landing and adjacent
      coprimality kills a jump of at most two. The earlier route charged one
      modulus per barrier and needed a Chinese-remainder product whose size was
      never controlled.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Erdős Problem #243"
    authors:
