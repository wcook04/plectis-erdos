  main_results:
    - declaration: "Erdos249257.ExternalVerification243ProtectedEpochEnergy.protected_epoch_energy_integer"
      file: "ExternalVerification243ProtectedEpochEnergy/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243ProtectedEpochEnergy/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `protected_epoch_energy_integer` in ErdosProblems/Erdos243/ProtectedEpochEnergy.lean, committed at 447d8f4b1b8d6c46e75d41276fc92e79323a7500
        (module SHA-256 1d51a1544d6e1affdac48c1c4d19e8f74b1ba58dd1b9ea9c156634a0d8b4bcfe). This packaging pass did not run Lean;
        elaboration is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "conditional per-epoch record-energy lower bound, uniform in cancellation"
      statement: >-
        Let `p` be an odd prime, `l ≥ 1`, `Q = p ^ l ≥ 16`, and suppose the orbit
        satisfies the division-free cocycle, coprimality, positivity and the
        centring bound `2 * w n ≤ 3 * u n` from index `s`, with `Q ∣ v s`,
        `4 * runningMax u s < p * Q`, and `p * Q ≤ 2 * u τ` for some `τ > s`.
        Then there is a finite set `J ⊆ [s, τ)` of steps, each a global record,
        each cancellation-free (`hc n = 1`) and each jumping by at least three,
        with `p * Q ≤ (8 * p + 8) * |J| + 4 * ∑_{n ∈ J} (u (n+1) - u n - 2) + 8 * p`.
      boundary: >-
        This is a lower bound on record energy inside one protected epoch. The
        matching upper bound, that a bounded-negative-part or summable orbit has
        finite total energy so infinitely many protected epochs are impossible,
        is not proved and is the open parent. The centring bound and the
        protection hypothesis `p ^ l ∣ v s` are assumed, not derived. Nothing
        here settles Erdős #243.
      comparator_declaration: "Erdos249257.ExternalVerification243ProtectedEpochEnergy.protected_epoch_energy_integer"
      literature_dependencies: []


