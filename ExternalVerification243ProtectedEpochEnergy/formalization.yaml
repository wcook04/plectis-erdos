version: "v0.4"

project:
  name: "Erd\u0151s #243: protected-epoch record energy from reusable odd-prime barriers"
  description: >-
    Conditional theorem: along a dynamically reduced primitive orbit with
    arbitrary cancellation and a nearest-integer centring bound, one odd prime
    power dividing a single denominator state forces an explicit lower bound on
    the record energy spent before the numerator reaches half of that prime
    power times the prime. The bound is uniform in the cancellation factors and
    uses no product of moduli. It is a lower bound per epoch, not a global
    finiteness statement, and Erdős #243 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

