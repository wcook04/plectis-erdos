version: "v0.4"

project:
  name: "Erdős #243: unit record-increment rigidity under arbitrary cancellation"
  description: >-
    Conditional theorem: if the running maximum of the reduced tail
    numerator eventually increases by at most one per step, and a fresh
    large prime power of the reduced denominator recurs at arbitrarily late
    indices, dominating the current record, then the multipliers satisfy the
    exact Sylvester recurrence eventually. No bound on the cancellation
    factors is assumed. The theorem is conditional on its explicit tail
    hypotheses and does not settle Erdős #243.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

