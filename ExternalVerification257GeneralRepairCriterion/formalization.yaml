version: "v0.4"

project:
  name: "Erdős #257: a pointwise repair criterion for base-two Mersenne achievement"
  description: >-
    A nonnegative real belongs to the base-two Mersenne achievement set exactly when its
    greedy defect fails to increase at cofinally many scales, and exactly when it fails to
    increase at one scale inside every window of width 2*sqrt(K) + 12 starting at K. The
    greedy defect at scale N is the dyadic numerator of the target minus the dyadic numerator
    already paid by the exponents the greedy rule has selected, so it is a single sequence of
    natural numbers attached to the target. The criterion replaces a quantifier over supports
    by a pointwise inequality on that sequence, and the second form localises the search to a
    window of width O(sqrt K), which is what makes a finite search at each scale meaningful.
    Both directions are proved. The readers are number theorists working on irrationality of
    Mersenne-type reciprocal sums. The criterion decides no particular target, in particular
    it does not decide one half, and it supplies no infinite-support irrationality argument.
    Erdős Problem 257 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

