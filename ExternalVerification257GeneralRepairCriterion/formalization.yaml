    authors:
      - "Will Cook"
    type: "original-proof"
    relationship: "other"
    note: >-
      The proof compares the greedy prefix numerator with the floor of the scaled target and
      shows that a scale at which the defect does not increase is exactly a scale at which the
      greedy rule recovers, then bounds the search window by the divisor bound tau(n) <= 2*sqrt(n).
    license: "Apache-2.0"
    author_endorsement: "participated"
