editorial_assessment:
  plectis_signal: The only unconditional equivalence in the corpus whose left side is
    the target problem itself. It relocates Erdős Problem 251 to a single hitting
    condition with a free offset. Prior-art disposition F2_251_free_pair_equivalence
    records confidence low-to-medium, since the systematic sweep of the dyadic
    tail-recurrence and Bezivin-style functional-equation literature was not run.
  prior_art_key: F2_251_free_pair_equivalence
