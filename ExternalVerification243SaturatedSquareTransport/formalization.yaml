    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "Erdos249257.ExternalVerification243SaturatedSquareTransport.saturated_square_transport_raw"
      file: "ExternalVerification243SaturatedSquareTransport/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243SaturatedSquareTransport/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `saturated_square_transport_raw` in ErdosProblems/Erdos243/SaturatedSquareTransport.lean, committed at 447d8f4b1b8d6c46e75d41276fc92e79323a7500
        (module SHA-256 1647bc4e0497187d1d5493badc01c5ec4e9f1960100d4c9872e78d39a938320e). This packaging pass did not run Lean;
        elaboration is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "unconditional exact transport identity for one primitive step"
      statement: >-
        If `w + v = a * u`, `w = hc * u'`, `a * v = hc * v'`,
        `e = v - (a - 1) * u` and `e' = v' - (a' - 1) * u'`, then
        `u' ∣ hc * e * e' - v ^ 2` over the integers.
      boundary: >-
        This is one step of the dynamic, with no orbit content. It bounds
        neither the cancellation factors nor the numerators, and it settles
        nothing about Erdős #243.
      comparator_declaration: "Erdos249257.ExternalVerification243SaturatedSquareTransport.saturated_square_transport_raw"
      literature_dependencies: []
    - declaration: "Erdos249257.ExternalVerification243SaturatedSquareTransport.legendre_defect_forces_nonsquare_content"
      file: "ExternalVerification243SaturatedSquareTransport/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243SaturatedSquareTransport/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `legendre_defect_forces_nonsquare_content` in ErdosProblems/Erdos243/SaturatedSquareTransport.lean, committed at 447d8f4b1b8d6c46e75d41276fc92e79323a7500
        (module SHA-256 1647bc4e0497187d1d5493badc01c5ec4e9f1960100d4c9872e78d39a938320e). This packaging pass did not run Lean;
        elaboration is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "exact reach of the quadratic-character obstruction, including its blindness"
      statement: >-
        If `u' ∣ b * e * e' - (b * s) ^ 2` and a prime `p` divides `u'` with
        `e * e'` a non-square in `ZMod p`, then `b ≠ 1`.
      boundary: >-
        The conclusion is exactly `b ≠ 1`, that is, the removed content is not a
        pure square. It gives no bound on the size of the content, it says
        nothing when the content is a perfect square, and it does not exclude
        `hc = 1` by any route. Quadratic-character counting cannot detect square
        deletion, and this declaration is where that limit is recorded.
      comparator_declaration: "Erdos249257.ExternalVerification243SaturatedSquareTransport.legendre_defect_forces_nonsquare_content"
      literature_dependencies: []


