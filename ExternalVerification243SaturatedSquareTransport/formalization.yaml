version: "v0.4"

project:
  name: "Erd\u0151s #243: saturated square transport across one primitive cancellation and the exact reach of its Legendre defect"
  description: >-
    Two declarations about one primitive step of a reciprocal tail dynamic. The
    first is an unconditional exact divisibility: the whole next reduced
    numerator divides the removed content times the product of the two centred
    errors, minus the square of the denominator. No positivity, primitivity,
    coprimality or cleanliness hypothesis appears. The second records the exact
    reach of the quadratic-character consequence, which obstructs only a unit
    non-square part and is blind to a square payment. Neither bounds the
    cancellation factors, and Erdős #243 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

palomar_qualification:
  status: "candidate_pending_mechanical_gates"
  selected_project: "formal_math/erdos257_period_noncollapse"
  comparator_config: "formal_math/erdos257_period_noncollapse/ExternalVerification243SaturatedSquareTransport/comparator.json"
  formalization_metadata: "formal_math/erdos257_period_noncollapse/ExternalVerification243SaturatedSquareTransport/formalization.yaml"
  repository_scope: "private_source_not_yet_pinned_in_public_repository"
  challenge_dependency_boundary: "Mathlib_only"
  replay_status: "terminal_positive_and_deliberate_negative_pair_pending_supported_runner"
  research_interest_status: "plausible_research_note_grade_conditional_result"
  submission_authorization: "operator_directed_submission_campaign_exact_public_identity_pending"
  blockers:
    - "result packet is not present in a public repository at a pinned full commit SHA"
    - "Lean elaboration of Challenge, Solution, NegativeSolution and AxiomAudit has not been run in this pass; the host build slot was occupied and the check is deferred to the next governed build"
    - "terminal positive acceptance and deliberate-negative mismatch rejection have not been recorded on a supported runner"
  note: >-
    The transport is strictly stronger than the corpus lemma that transports
    only modulo the largest divisor of the next numerator coprime to the
    removed content. It dominates no packaged entry: no other packaged
    declaration states a transport identity for this step.

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A63", "11A15", "11B37"]

sources:
  - title: "Saturated square transport and the Legendre defect charge"
    authors:
      - "Will Cook"
    type: "original-proof"
    relationship: "other"
    note: >-
      Two orientation identities follow from the cocycle with no sign or size
      side condition. Multiplying them and using the cocycle again to remove the
      spurious multiplier gives an exact identity whose right-hand side is the
      raw numerator times an explicit integer, which is the whole content of the
      transport. The negative half is equally deliberate: when the removed
      content is a perfect square the congruence degenerates and carries no
      quadratic-character information, so this method can never detect square
      deletion.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Erdős Problem #243"
    authors:
      - "Thomas F. Bloom"
    id: "https://www.erdosproblems.com/243"
    type: "web discussion"
    relationship: "background"
    note: >-
      The catalogue supplies the problem statement, numbering, references and
      open status. The result below is not attributed to the catalogue.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Mathlib"
    authors:
      - "The mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    relationship: "background"
    license: "Apache-2.0"
    author_endorsement: "n/a"

