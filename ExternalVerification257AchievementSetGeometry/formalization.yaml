version: "v0.4"

project:
  name: "Erdős #257: rational-fibre null theorem and supported Mersenne achievement-set geometry"
  description: >-
    A supported Mersenne achievement set is the set of reals coded by binary
    strings whose support lies in a fixed set J of allowed digit positions,
    where digit position k contributes the Mersenne weight 1 / (2^(k+1) - 1).
    Two declarations are compared. The first is a measure no-go on rational
    fibres. If 0 is not in J and the sum of 1 / (2^m - 1) over m in J is a
    rational number, the achievement set supported on J has Lebesgue measure
    zero. Positive-measure selection over a rational fibre is excluded by
    that measure-zero conclusion. An exceptional null point stays unexcluded.
    In that first declaration the set J indexes exponents in the hypothesis
    and digit positions in the conclusion. The second declaration classifies
    the whole family, with no hypothesis on J. The supported digit map is
    injective, its range is compact, its range is nowhere dense, the range is
    perfect whenever J is infinite, and the Lebesgue measure of the range
    satisfies an exact dichotomy: when the omitted digit positions form a
    finite set F the measure is the reciprocal of 2^|F|, and when infinitely
    many digit positions are omitted the measure is zero. Both statements are
    proved for the literal Mathlib-only definitions repeated in the Challenge
    module. The compared declarations establish no irrationality of any
    infinite Mersenne subseries, and Erdős Problem 257 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

