version: "v0.4"

project:
  name: "Erdős #251: exact rational-tail collapse for the actual prime-gap dyadic series"
  description: >-
    If the dyadic series over the actual consecutive prime gaps fails to be irrational, then
    one rational candidate S represents it and the rational states 2^(N+1) (S - partial sum
    through N + 1) are exactly the scaled real tails of the series. For every rational S,
    without any rationality hypothesis, those states satisfy the actual prime-gap recurrence
    T(N + 1) = 2 T(N) - g(N + 1) identically. Complete decomposition of the candidate
    denominator then produces one positive shift h for which T(N + h) - T(N) is an integer
    at every sufficiently late index. For that same denominator-selected shift,
    nonperiodicity of the actual prime gaps forces T(N + h) - T(N) out of the open interval
    from -1 to 1 infinitely often, because eventual integrality together with eventual
    smallness would make the shift eventually zero and the gap sequence eventually periodic.
    Every rational candidate for the actual series is therefore pinned to an exact
    arithmetic normal form with one located obstruction, which is the object an
    irrationality proof for this series would have to attack. Priority for the argument has
    not been assessed. The development supplies no eventual-smallness producer and no
    irrationality theorem, and the located obstruction is compatible with rationality, so
    the sole surviving escape is eventual integrality of the selected shift without uniform
    smallness and Erdős Problem 251 is not decided here.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

