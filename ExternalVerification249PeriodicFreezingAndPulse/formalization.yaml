editorial_assessment:
  plectis_signal: >-
    The freezing corollary is the reusable half of the kernel-rank theorem: it is what
    lets a relation with periodic coefficients be excluded without recomputing the
    evaluation matrix. The pulse criterion is the note's own quantifier shape, which
    the earlier library interface did not state.
  prior_art_state: >-
    The separation mechanism is Erdős 1948 and the independence mechanism is the
    standard Chinese-remainder-plus-Dirichlet evaluation argument. No exact prior
    statement of either declaration in this form has been located, and neither is
    presented as novel.
  sharpness_gap: >-
    The freezing statement is stated for positive slopes and pairwise nonzero cross
    determinants. No declaration here shows either hypothesis cannot be relaxed.
