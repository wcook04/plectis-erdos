version: v0.4
project:
  name: 'Erdős #249: coefficient freezing for totient sections and the bounded
    isolated pulse criterion'
  description: >-
    Two declarations are compared. The first is a rigidity statement for the totient
    kernel. Let L i (n) = a i * n + b i be finitely many affine forms with positive
    slopes and pairwise nonzero cross determinants a i * b j - a j * b i, and let the
    coefficient sequences w i from the naturals to the rationals each be periodic with
    their own positive period. If the sum over i of w i (n) * φ(a i * n + b i) vanishes
    for every sufficiently large n, then w i (n) = 0 for every i and every n. Both the
    per-coefficient periods and the eventual quantifier are as printed in the note: the
    relation is assumed only above a threshold, and no common period is assumed. The
    second declaration is the Diophantine criterion in the note's own shape. For an
    integer sequence a with |a n| ≤ C for every n, if for every height L₀ there are L
    at least L₀ and N greater than L with a N nonzero and a (N - j) = a (N + j) = 0 for
    every j with 0 < j ≤ L, then the sum over n at least 0 of a (n+1) / 2^(n+1) is
    irrational. The n = 0 term of the full binary value is an integer and is removed
    explicitly, so the conclusion is stated over the positive indices as printed. The
    separation mechanism is that of P. Erdős, On arithmetical properties of Lambert
    series, Journal of the Indian Mathematical Society 12 (1948). Neither declaration
    concerns the series of φ(n)/2^n, no declaration here supplies a certificate for it,
    and Erdős Problem 249 remains open.
