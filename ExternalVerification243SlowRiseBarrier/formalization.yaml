  main_results:
    - declaration: "Erdos249257.ExternalVerification243SlowRiseBarrier.no_slowRise_reducedTail"
      file: "ExternalVerification243SlowRiseBarrier/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243SlowRiseBarrier/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `no_slowRise_reducedTail` in
        ErdosProblems/Erdos243/SlowRiseBarrier.lean, committed at
        629841823a3f1e3f6e3792ec8c069ba41909643a (module SHA-256
        3f9ea00f795247964473c664dcc95f63fe4525a2ea65c3a5491b347c5858688b).
        This packaging pass did not run Lean; elaboration of the Challenge,
        Solution and AxiomAudit modules is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "conditional slow-rise exclusion, strictly generalising bounded-rise exclusion"
      statement: >-
        For a reduced exact tail with `1 < a n` and `Nat.Coprime (u n) (v n)`
        from `N`, cocycle equations `u (n+1) + v n = a n * u n` and
        `v (n+1) = a n * v n`, and `u` tending to infinity, there is no block
        length `B` with `u (N + B)` below `P = ∏ i : Fin B, a (N + i)` and
        `u (n+1) ≤ u n + B` at every `n ≥ N + B` with `u n < 2 * P`.
      boundary: >-
        The block-start bound and the windowed rise bound are hypotheses. The
        analytic transfer that supplies them on the canonical orbit, including
        the choice of moduli and the admissibility of a doubly-logarithmic
        rise budget, is an ordinary proof recorded in
        SlowNegativePartRigidity.md and is not formalised. Nothing here
        settles Erdős #243.
      comparator_declaration: "Erdos249257.ExternalVerification243SlowRiseBarrier.no_slowRise_reducedTail"
      literature_dependencies: []

