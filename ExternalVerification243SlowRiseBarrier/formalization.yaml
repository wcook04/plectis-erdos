version: "v0.4"

project:
  name: "Erdős #243: slow-rise exclusion for reduced exact reciprocal tails"
  description: >-
    Conditional theorem: a reduced exact tail with multipliers exceeding one
    and numerator tending to infinity cannot, for any block length B, start
    below the product of its first B multipliers and then rise by at most B
    per step while the numerator stays below twice that product. The rise
    budget is required only on that finite window, which strictly generalises
    the uniform bounded-rise exclusion. The block-start and windowed-rise
    hypotheses are assumed, not derived, and Erdős #243 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

palomar_qualification:
  status: "candidate_pending_mechanical_gates"
  selected_project: "formal_math/erdos257_period_noncollapse"
  comparator_config: "formal_math/erdos257_period_noncollapse/ExternalVerification243SlowRiseBarrier/comparator.json"
  formalization_metadata: "formal_math/erdos257_period_noncollapse/ExternalVerification243SlowRiseBarrier/formalization.yaml"
  repository_scope: "private_source_not_yet_pinned_in_public_repository"
  challenge_dependency_boundary: "Mathlib_only"
  replay_status: "terminal_positive_and_deliberate_negative_pair_pending_supported_runner"
  research_interest_status: "plausible_research_note_grade_conditional_rigidity_theorem"
  submission_authorization: "operator_directed_submission_campaign_exact_public_identity_pending"
  blockers:
    - "result packet is not present in a public repository at a pinned full commit SHA"
    - "Lean elaboration of Challenge, Solution and AxiomAudit has not been run in this pass; the host build slot was occupied and the check is deferred to the next governed build"
    - "terminal positive acceptance and deliberate-negative mismatch rejection have not been recorded on a supported runner"
  note: >-
    This entry dominates the bounded-rise declaration
    no_boundedRise_reducedTail already carried by
    ExternalVerification243BoundedRiseReducedTail: a uniform rise bound is the
    special case of the windowed bound proved here. The dominance is recorded
    rather than acted on; retiring or merging the earlier entry is an
    editorial decision for the launch selection, not a mechanical one.

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A63", "11B37"]

sources:
  - title: "Slow-rise exclusion by common-divisor persistence on reduced reciprocal tails"
    authors:
      - "Will Cook"
    type: "original-proof"
    relationship: "other"
    note: >-
      The proof replaces gcd stabilisation, which needs bounded negative
      magnitudes, by persistence: a common divisor of the numerator and
      denominator states at one index divides every later state, so landing on
      a Chinese-remainder block of pairwise-coprime multipliers locks a block
      modulus into every later centred error. Placing the block in the
      interval from P to 2P is what confines the rise budget to a finite
      window.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Erdős Problem #243"
    authors:
      - "Thomas F. Bloom"
    id: "https://www.erdosproblems.com/243"
    type: "web discussion"
    relationship: "background"
    note: >-
      The catalogue supplies the problem statement, numbering, references and
      open status; the exclusion theorem is not attributed to the catalogue.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Mathlib"
    authors:
      - "The mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    relationship: "background"
    license: "Apache-2.0"
    author_endorsement: "n/a"

