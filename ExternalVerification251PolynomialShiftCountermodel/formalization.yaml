  type: preprint
  relationship: background
  note: >-
    Posted to the erdosproblems.com #251 thread on 15 April 2026. Theorem 1 constructs
    integers g_n with g_n at least 2 and g_n = o(p_n) such that the sum of p_n/(g_1...g_n)
    equals 1, refuting the neighbouring irrationality conjecture printed under #251. That is
    the same species of telescoping countermodel as the construction formalized here, applied
    to a different object and published first. It is cited beside the value 32 for that reason.
