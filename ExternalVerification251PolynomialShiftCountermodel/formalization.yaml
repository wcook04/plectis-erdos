version: v0.4
project:
  name: 'Erdős #251: exact countermodel to coarse gap-profile irrationality routes'
  description: >-
    The dyadic series of the explicit digit word g(n) = 2(n^2 + 4n + 2) sums to the
    rational number 32, so that sum is not irrational. The same compared theorem records
    the properties of the word that hold alongside that value. The word and the explicit
    rational orbit T(n) = 2(n + 4)^2 satisfy the dyadic tail recurrence T(N + 1) = 2 T(N)
    - g(N + 1) at every index. The word is positive, even and strictly increasing, hence
    unbounded and not eventually periodic. Every fixed tail shift T(N + h) - T(N) is an
    integer for every h and every N. Every adjacent difference g(n + 1) - g(n) equals
    4n + 10 at every index n, so it is never 2 and never -2. Positivity, parity, polynomial
    growth, unboundedness, nonperiodicity, the dyadic recurrence and integrality at every
    fixed shift are therefore jointly compatible with a rational sum, and no argument that
    uses only those properties can force irrationality. The mechanism is an integer-valued
    quadratic orbit, which turns all-shift integrality into a polynomial identity over the
    integers; the word has constant second difference, so its adjacent differences grow
    linearly and clear the small window from the outset; and the exact finite telescope
    of the series equals 32 minus the scaled terminal state, whose terminal term tends to
    zero. The word is a model sequence and is not the consecutive-prime-gap word, so this
    theorem is internal infrastructure that closes one of the author's own proof routes and
    decides nothing about Erdős Problem 251. A telescoping countermodel of the same species,
    for the neighbouring conjecture printed under #251, was published first by Vjeko Kovač
    on 15 April 2026 and is cited below. The readers are number theorists working on the
    irrationality of the dyadic prime-gap series.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
