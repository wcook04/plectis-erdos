  type: original-proof
  relationship: other
  note: >-
    This formalization presents the complete exact countermodel as one theorem: the explicit
    quadratic word and orbit obey the dyadic recurrence, retain integrality at every fixed
    shift, have adjacent difference exactly 4n + 10 at every index, and produce the rational
    dyadic series value 32. The result is a strategy-elimination theorem beneath the still-open
    Erdős Problem 251.
