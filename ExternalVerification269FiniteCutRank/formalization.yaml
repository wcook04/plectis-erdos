version: "v0.4"

project:
  name: "Erdős #269: exact rank of the sampled cut family"
  description: >-
    Over an arbitrary field, and for a scalar c distinct from 0 and 1, the cut column
    v_k of length m carries 1 in each of its first k coordinates and c in the rest. For a
    finite set E of cuts, each at most m, a matrix whose set of columns is exactly the
    family indexed by E has rank equal to the cardinality of E, reduced by one exactly
    when both extreme cuts 0 and m occur. The proof isolates the single degeneracy: the
    consecutive differences are scalar multiples of indicators of disjoint nonempty
    blocks, so every interior cut carries coefficient zero in any relation, while the two
    extreme columns are proportional. The column hypothesis is an equality of column
    ranges, so repeated and permuted columns need no separate assumption. The readers are
    number theorists and linear algebraists reading the Erdős 269 note; the statement is
    a finite rank computation and carries no arithmetic content about running least
    common multiples.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

