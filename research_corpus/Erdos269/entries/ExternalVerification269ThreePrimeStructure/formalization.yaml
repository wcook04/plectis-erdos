version: "v0.4"

project:
  name: "Erdős #269: exact three-prime running-LCM identity and infinite kernel rank"
  description: >-
    For pairwise distinct primes p, q, r and every nonzero x, the least common multiple of
    all smooth numbers p^i q^j r^k at most x equals the product of the three maximal pure
    prime powers below x. The reciprocal-height kernel K(i,j,k) built from that identity is
    constant on every logarithmic cell, and the first m positive jump values across the
    three prime channels number exactly 3m. Every finite exponent box sums to the
    height-fibre normal form, the sum over genuine running-LCM heights of the fibre
    cardinality divided by the height, and a multiplicative shell of width factor r inside a
    sorted exponent budget j satisfies 9 times its cardinality at most (j+3)^2. For every
    order n there are injective index families giving a nonsingular n by n minor of K
    uniformly in the remaining exponent layer, so K has infinite rank and no finite
    separable representation K(i,j,k) = sum over l < d of f_l(i) G_l(j,k) exists for any d.
    The smallest 2,3,5 rectangle has determinant exactly -1/15. Three distinct primes keep
    the three logarithm floors independent, which is what makes the running-LCM identity
    exact and the minors nonsingular in every order, and it removes every method that would
    evaluate the three-prime sum by finitely many separated factors. The running-LCM
    factorisation identity for every finite prime set, and the two-prime case in which the
    series factorises and is transcendental by Hecke and Mahler, are due to Steve Fan
    (erdosproblems.com/269 comment, 26 June 2026), who also records that the factorisation
    does not extend to three or more primes; the identity theorem here formalises his
    identity at three primes, and the rank statements are the addition. Priority for the
    rank statements has not been established, none of the seven theorems yields
    irrationality or transcendence, and Erdős #269 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

