project:
  name: "Erdős #269: actual infinite dyadic shell orbit"
  description: >-
    The literal real masses of the half-open dyadic shells in the 2,3,5-smooth
    running-height series are summable. Their genuine infinite tail obeys the
    exact ordered affine recurrence at every scale, and its normalized state
    either reaches an integer or is cofinally at distance at least 1/31 from
    every integer. The integral branch is not excluded, so Erdős Problem 269
    remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

