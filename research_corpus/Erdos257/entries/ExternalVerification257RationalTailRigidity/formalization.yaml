version: "v0.4"

project:
  name: "Erdős #257: rational values force unbounded integer tail orbits and mass lower bounds"
  description: >-
    Suppose the series of 1/(2^a - 1) over an infinite set A of positive integers takes the
    rational value p/(2^c v) with v positive, and write d_A(n) for the number of divisors of
    n lying in A. The denominator-cleared binary tails are then strictly positive integers
    u(n) obeying the exact recurrence u(n+1) + v d_A(c+n+1) = 2 u(n) and the residue law
    u(n) = p 2^n mod v, and they are unbounded. Under the same rational value every zero
    window of d_A is sublogarithmic: for each eps > 0 there is a constant B with h ≤ eps
    log_2(N+1) + B for every window position N and every window length h. If the reciprocal
    mass of A converges and the reduced denominator v is odd and greater than one, that mass
    is at least the reciprocal of the multiplicative order of 2 modulo v, and for a dyadic
    value with A infinite the reciprocal mass diverges or exceeds one strictly. One
    mechanism produces all four laws: the divisor-counting coefficients of the support are
    the binary coefficients of the value, so clearing the denominator turns rationality into
    a positive integer orbit under doubling, and each law measures how often the support
    must fire to keep that orbit positive and unbounded. These are support-uniform necessary
    conditions in the irrationality theory of reciprocal-power series, imposed with no
    density or regularity assumption on A, and priority for them has not been established.
    They do not contradict all rational values, and Erdős #257 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

