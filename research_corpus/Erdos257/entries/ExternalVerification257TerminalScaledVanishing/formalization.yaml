version: "v0.4"

project:
  name: "Erdős #257: terminal scaled-vanishing counterexample endpoint"
  description: >-
    A terminal scaled-vanishing sequence of finite Boolean support words
    produces an infinite support whose base-two reciprocal-Mersenne subseries
    is exactly one half, and therefore refutes the universal irrationality
    assertion in Erdős Problem 257. The theorem is conditional: it does not
    construct the sequence or settle the parent problem.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

