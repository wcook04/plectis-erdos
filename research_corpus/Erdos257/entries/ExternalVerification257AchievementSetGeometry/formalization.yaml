version: "v0.4"

project:
  name: "Erdős #257: supported Mersenne achievement-set geometry"
  description: >-
    For every set J of allowed binary Mersenne coordinates, the supported
    digit map is injective and has compact nowhere-dense range; the range is
    perfect when J is infinite. Its Lebesgue measure is exactly 2^(-|F|) when
    J omits the finite set F, and zero when the omitted coordinates are
    infinite. This support-uniform geometric classification does not prove
    universal Mersenne-subseries irrationality or solve Erdős Problem 257.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

