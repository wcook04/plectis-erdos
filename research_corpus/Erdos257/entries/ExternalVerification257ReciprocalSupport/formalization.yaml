project:
  name: "Erdős #257: irrationality for every reciprocal-summable support and every integer base"
  description: >-
    For every infinite set A of exponents whose reciprocal sum converges and every integer
    base b at least two, the series with terms 1/(b^a - 1) supported on A is irrational. The
    theorem settles the whole reciprocal-summable support regime at once and uniformly in
    the base, with no pairwise-coprimality, periodicity, density or powerful-support
    hypothesis, and with the zero exponent normalised to zero by real division. Any
    counterexample to the universal Erdős Problem 257 must therefore be supported on a set
    whose reciprocal sum diverges. The mechanism produces close returns of shifted binary
    support atoms from an LCM-prefix orbit-mean argument, transfers them to every radix
    through a uniform pointwise inequality bounding the base-b atom displacement by twice
    the binary one, and closes with an exact radix integer orbit. Erdős (1968) proved the
    pairwise-coprime reciprocal-summable case for every integer base t at least two and
    stated that pairwise coprimality is superfluous by a more complicated argument he did not
    print; this formalization proves that stated extension, in every integer base, by an
    independent argument. No theorem-priority claim is made and no identification with
    Erdős's omitted argument is asserted. The audience is analytic number theorists working on
    irrationality of Mersenne-type reciprocal subseries. Reciprocal-divergent supports are
    untouched, so the universal Erdős Problem 257 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

