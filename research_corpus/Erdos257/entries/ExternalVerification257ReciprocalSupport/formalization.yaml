sources:
  - title: "On the irrationality of certain series"
    authors:
      - "Paul Erdős"
    id: "https://users.renyi.hu/~p_erdos/1969-09.pdf"
    type: "paper"
    location: "The Mathematics Student 36 (1968, issued 1969), 222--226"
    relationship: "independently-proves"
    note: >-
      Erdős proves the pairwise-coprime reciprocal-summable case for every
      integer base t at least two (Math. Student 36, p. 222) and states that
      pairwise coprimality is superfluous by a more complicated argument,
      without printing that argument (p. 226 names fractional parts of t^n
      alpha as the mechanism). This formalization independently proves the
      stated no-coprimality conclusion in every integer base; the base
      generality is Erdős's own, and the removed hypothesis is the only
      strengthening over his printed theorem. A bounded source search
      (audit 2026-09-02, docs/formal_math/palomar/prior_art_adjudication_2026_09_02.md)
      found no printed proof of the extension, but that non-location does
      not support a first-proof or priority claim.
