version: "v0.4"

project:
  name: "Erdős #251: exact countermodel to coarse gap-profile irrationality routes"
  description: >-
    The explicit digit word g(n) = 2(n^2 + 4n + 2) and the explicit rational orbit T(n) =
    2(n + 4)^2 satisfy the dyadic tail recurrence T(N + 1) = 2 T(N) - g(N + 1) at every
    index. The word is positive, even and strictly increasing, hence unbounded and
    nonperiodic; every fixed tail shift T(N + h) - T(N) is an integer for every h and every
    N; and every difference of consecutive digits past the first term is at least fourteen,
    so it is never 2 or -2. The construction is an exact countermodel, and it eliminates
    every argument that would force the adjacent small-mismatch producer out of positivity,
    parity, polynomial growth, unboundedness, nonperiodicity, the dyadic recurrence and
    integrality at every fixed shift taken together. The mechanism is that an integer-valued
    quadratic orbit turns all-shift integrality into a polynomial identity over the integers
    while the word has constant second difference, so its adjacent differences grow linearly
    and clear the small window from the outset. The readers are number theorists working on
    the irrationality of the dyadic prime-gap series; priority for the construction has not
    been assessed. The orbit is not the actual consecutive-prime-gap orbit, so the theorem
    does not decide Erdős Problem 251.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

