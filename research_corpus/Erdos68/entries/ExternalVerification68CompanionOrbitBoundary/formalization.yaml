version: "v0.4"
project:
  name: "Erdős #68 companion-orbit rationality boundary"
  description: "Rationality of the Erdős #68 series S = sum over d at least 2 of 1/(d! - 1) is equivalent to eventual residence of an explicit factorial orbit in one congruence class. The fixed companion constant is C = sum over n at least 2 of 1/(n!(n! - 1)), and S is rational exactly when floor(m! C) is congruent to -2 modulo m for all sufficiently large m, and irrational exactly when that residue is missed cofinally. The same equivalence is proved at every real base point x: the number x + (e - 2) is rational exactly when the canonical factorial digits of x are eventually m - 2, equivalently when floor(m! x) is congruent to -2 modulo m eventually. Each member of the shifted family sum over n at least 2 of 1/(n! + t) therefore falls under the boundary once its companion constant is named, and the member t = -1 is carried out in full here. The evaluation sum over n at least 2 of 1/n! = e - 2 supplies the shift. Every statement is an exact equivalence in both directions. The boundary is that an equivalence produces no cofinal miss of the exceptional residue on its own, so this development leaves the irrationality of S undecided and Erdős #68 open."
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]
