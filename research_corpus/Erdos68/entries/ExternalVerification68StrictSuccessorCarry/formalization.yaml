version: "v0.4"

project:
  name: "Erdős #68: companion-orbit and strict-successor characterizations"
  description: >-
    Two Lean-checked lossless reformulations of the factorial-gap irrationality
    problem. For the fixed companion constant C, non-irrationality is
    equivalent to eventual concentration of floor(m! C) at -2 modulo m, and
    irrationality is equivalent to cofinal escape. In the strict-successor
    coordinate, non-irrationality is equivalent to eventual unit carries and
    irrationality to cofinal failures of exact prefix divisibility. Neither
    theorem proves that the cofinal failures occur or solves Erdős Problem 68.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

