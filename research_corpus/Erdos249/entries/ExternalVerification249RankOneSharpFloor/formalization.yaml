version: "v0.4"

project:
  name: "Erdős #249: explicit 21/320 floor for the positive rank-one Möbius Mersenne cone"
  description: >-
    Write Θ₂ for the Möbius Mersenne rung, the sum of μ(d)/(2^d - 1)^2 over d at least 1,
    write t_Y(r) for its first Y atoms at exponent r, and set Q(e,Y) = t_Y(e+2)^2 /
    t_Y(2e+2) on the admissible range e at least 1 and Y at least 4. Every admissible Q(e,Y)
    exceeds Θ₂ by more than 21/320, and the value Q(1,5) at the five-atom first-depth kernel
    is attained at no other admissible pair. The unit-fraction boundary is settled exactly:
    1/16 is a valid uniform floor for the gap and 1/15 fails at an admissible pair, so 1/16
    is the largest unit fraction bounding the gap from below. The floor survives mixing,
    since for every nonempty finite family of admissible pairs with positive weights the
    weighted mean of the quotients still exceeds Θ₂ + 21/320, so no positive combination of
    rank-one blocks approaches Θ₂. Any rational representation Q(e,Y) = p/q with q at least
    1 gives the explicit bound |qΘ₂ - p| > 21q/320, a rational linear-form obstruction of
    the kind used in irrationality measures for lacunary Möbius sums. Exact evaluation of
    the finite Möbius Mersenne prefixes combines with a uniform interval bound to reduce the
    two-parameter admissible family to a finite comparison, and the family is first
    presented in this development with its novelty unassessed. Signed cancellation and
    genuinely coupled higher-rank constructions lie outside every statement here, so Erdős
    Problem 249 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

