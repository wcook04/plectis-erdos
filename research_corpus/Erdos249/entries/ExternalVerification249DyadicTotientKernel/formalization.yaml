version: "v0.4"

project:
  name: "Erdős #249: complete dyadic totient-kernel structure"
  description: >-
    The two zero-residue base channels and one odd-residue channel at each
    positive dyadic level form a linearly independent spanning family for all
    dyadic sections of Euler's totient. The complete family through level e
    has the same span as the duplicate-free canonical truncation and exact
    rank 2^e+1. This unconditional structural theorem does not prove
    irrationality of the binary totient series.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

