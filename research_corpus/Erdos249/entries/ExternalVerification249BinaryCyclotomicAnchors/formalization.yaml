version: "v0.4"
project:
  name: "Erdős #249: unconditional clean prime anchors in the binary cyclotomic layers"
  description: >-
    For every ray multiplier h > 0 and every threshold N0 there exist primes q and p with p
    dividing the binary cyclotomic layer |Phi_{hq}(2)|, p coprime to hq, hq dividing p - 1,
    and p - 1 at least N0. The same arithmetic gives unbounded prime-divisor support on
    every positive ray: for all bounds B and N0 there are primes q at least N0 and p greater
    than B with p dividing |Phi_{hq}(2)|. Both statements are unconditional, and the
    mechanism is the exact multiplicative order of 2, since a prime divisor of 2^q - 1 for
    prime q has 2 of order exactly q and therefore satisfies q dividing p - 1, which is what
    makes the anchor clean and its index remote. Prime support alone cannot force the
    annihilation that irrationality needs: if the binary totient series, the sum of
    phi(n)/2^n, were rational, then some positive period h would have eventually integral
    tail differences while that same ray still carried unbounded prime divisors. The subject
    is irrationality of the binary totient series, the layers and the order argument are
    classical, and the theorem family assembled here is first presented in this development
    with its novelty unassessed. The exact ceiling is an equivalence: the binary totient
    series is irrational if and only if, for every period h > 0 and every threshold, there
    is a clean anchor at some prime index whose dyadic window discrepancy over some length L
    sits strictly inside its residue range modulo 2^L, at distance more than p + h q + L + 1
    from both ends. The clean anchors are proved and the certified discrepancy is the
    missing producer, so the equivalence yields no irrationality result and a carry or phase
    escape is still required.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]
