project:
  name: "Erdős #243: bounded-negative-part rigidity"
  description: >-
    Exact reciprocal-tail dynamics with eventual strict centering, an
    eventual one-sided lower bound on the centered error, and division-free
    normalized vanishing have zero centered defect eventually and obey the
    exact Sylvester recurrence eventually. No periodicity assumption is used.
    The theorem is conditional and does not settle unrestricted Erdős #243.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

