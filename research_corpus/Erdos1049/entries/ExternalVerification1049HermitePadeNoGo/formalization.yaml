version: "v0.4"

project:
  name: "Erdős #1049: sharp rectangular Hermite–Padé threshold no-go with unique equality point"
  description: >-
    On the admissible region ρ ≥ 0 and σ ≥ 1 + ρ, the rectangular two-function threshold of
    the explicit exponent model, formed from the decay exponent (1 + ρ²)/2 + σ, the height
    exponent (1 + ρ)²/2 + σ (1 + ρ) and the cyclotomic saving 3σ²/π², is at most 1/2 - 1/π².
    Equality holds exactly at ρ = 0 and σ = 1, the classical one-function endpoint, so the
    bound is sharp and its equality locus is a single point. The proof clears denominators
    into one gap functional and expands it exactly at σ = 1 + ρ + u, where the value is
    -π²ρ² - π²ρu - 2π²ρ - 2ρ² - 10ρu - 4ρ - 6u² - 8u and every term is nonpositive for ρ ≥ 0
    and u ≥ 0. The gap is therefore nonpositive across the whole admissible region and
    vanishes only at that endpoint, so no admissible parameter pair of this model improves
    on the classical one-function threshold. The subject is Diophantine approximation by
    simultaneous rational approximants, and the statement is a sharp method boundary for
    anyone weighing a rectangular Hermite–Padé attack; novelty is unassessed. The theorem
    applies only to the exponent model encoded by these definitions. It does not construct
    Hermite–Padé approximants and does not settle Erdős #1049.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

