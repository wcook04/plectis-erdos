version: "v0.4"

project:
  name: "Erdős #1049: prime support forces the sharp 1/q gap in q-Apéry linear forms"
  description: >-
    For an integral linear form B (a/q) - A at a rational target with q > 0, a single prime
    l dividing B and dividing neither A nor q forces the sharp gap |B (a/q) - A| ≥ 1/q, and
    the same gap follows from l^r | B for any exponent r ≠ 0. For a pair of rows the
    numerator hypothesis can be dropped: if l divides both B_1 and B_2 and l^2 does not
    divide the exterior determinant A_1 B_2 - A_2 B_1, then at least one of the two rows
    already has the full 1/q gap. Along any sequence of integral row pairs whose exterior
    determinant is nonzero at every index, the two real linear forms cannot both tend to
    zero at a rational target, so no such pair of selectors can jointly witness vanishing.
    Recombination does not evade this: a real change of basis whose determinant has absolute
    value 1 and whose four entries are bounded by H, making both recombined remainders at
    most epsilon, forces |A_1 B_2 - A_2 B_1| ≤ 2 H epsilon (|B_1| + |B_2|), so joint decay
    is paid for in determinant size, and integer-unimodular recombination is the special
    case. When every denominator coordinate vanishes modulo N the pigeonhole only has to see
    the numerator coordinate, so N < 2^k already forces a nontrivial binary selector
    collision in both coordinates. For a q-Apéry approach to the Lambert value at 3/2 the
    consequence is a precise specification of what is still missing: prime or prime-power
    support in the denominator coordinates that persists cofinally, together with
    determinant control that survives recombination; the ancestry is the classical
    Apéry-style linear-form argument, and priority is unassessed. Producing that cofinal
    support for the actual q-Apéry rows, the analytic decay, and irrationality at 3/2 remain
    open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

