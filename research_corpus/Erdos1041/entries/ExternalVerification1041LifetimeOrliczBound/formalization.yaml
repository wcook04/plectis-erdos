# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #1041: attachment-age/lifetime Orlicz frontier"
  description: >-
    A merge edge's lifetime is the exact universal nonlinear transform
    k Phi(x) of its attachment-age increment. The transform is strictly
    convex but sublinear at the origin, so no positive uniform linear age
    charge exists. Weighted chain bounds and an exact root-summed identity
    yield a sharp two-young-root selector. These results sharpen the metric
    allocation frontier without solving Erdős #1041.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

palomar_qualification:
  status: "candidate_family_pending_analytic_core_formalization_and_mechanical_gates"
  selected_project: "formal_math/erdos257_period_noncollapse"
  comparator_config: "formal_math/erdos257_period_noncollapse/ExternalVerification1041LifetimeOrliczBound/comparator.json"
  formalization_metadata: "formal_math/erdos257_period_noncollapse/ExternalVerification1041LifetimeOrliczBound/formalization.yaml"
  repository_scope: "private_source_not_yet_pinned_in_submission_repository"
  challenge_dependency_boundary: "Mathlib_only"
  replay_status: "terminal_positive_and_deliberate_negative_pair_pending_supported_runner"
  research_interest_status: "plausible_research_note_grade_exact_nonlinear_currency_no_go_and_selector"
  submission_authorization: "operator_directed_palomar_campaign_external_action_not_performed_by_this_local_task"
  blockers:
    - "the present lead Challenge covers only the lifetime-to-Orlicz scalar division consumer, not the ordinary analytic core"
    - "the exact integral substitution, convexity and Jensen argument, and merge-tree double count are not yet Lean-formalized in a composite Comparator package"
    - "the selected result family is not pinned in the operator's submission repository at one immutable public commit"
    - "terminal positive acceptance and deliberate-negative mismatch rejection are not recorded on a supported runner for the final selected package"
  note: >-
    The coherent theorem family is the intended Palomar submission object;
    its five current scalar interfaces are subordinate formal consumers, not
    separate submission candidates. The open parent problem is not a veto.
    No local artifact is represented as a Palomar verdict or registry entry.

