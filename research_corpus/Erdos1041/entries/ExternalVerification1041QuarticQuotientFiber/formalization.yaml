version: "v0.4"
project:
  name: "Erdős #1041: strict length budget below two for quotient-fibre root lifts"
  description: >-
    If α > 0 and the two endpoint moduli a and b lie in [0,1), then a^α + b^α < 2, and any
    length bounded by that budget is strictly below two, the threshold appearing in Erdős
    #1041. The budget requires only positivity of the exponent and endpoint moduli strictly
    below one, so the entire open range of admissible endpoints is covered. The density
    input is an exact comparison: for α ≤ 1 and x > 0 the root-lift density on an offset
    line, (√(d² + x²))^(α-1), is at most the density x^(α-1) on the parallel line through
    the origin. The axis majorant integrates exactly, α ∫₀^A x^(α-1) dx = A^α for α > 0 and
    A ≥ 0, which converts the offset comparison into the powered endpoint budget. This
    closes the quantitative root-lift stage of the translated quartic quotient-fibre
    construction, since every admissible lift is then held strictly under the threshold. The
    material is elementary real analysis serving a lemniscate length problem in geometric
    function theory; novelty is unassessed. The cited geometric lemma for the quartic, the
    covering-space lift construction and the final path assembly remain outside Lean.
