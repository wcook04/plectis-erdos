version: "v0.4"
project:
  name: "Erdős #1041: strict lemniscate containment of trinomial root spokes"
  description: >-
    For every root w of z^m + a z^r + c with 1 ≤ r ≤ m, ‖w‖ < 1 and ‖c‖ < 1, the polynomial
    has modulus strictly below one at every point of the spoke, the segment u w for u in
    [0,1] running from the origin to the root. No condition on the middle coefficient a is
    required. The mechanism is an exact factorisation that eliminates a at the root: the
    value at u w equals (1 - u^r) c - (u^r - u^m) w^m for every real u. Each quotient root
    of modulus below one therefore supplies a complete radial displacement whose image stays
    strictly inside the unit lemniscate, which settles the local geometric step for the
    whole translated cyclic-trinomial family. Two such displacements of modulus below one
    have total length strictly below two, the threshold appearing in Erdős #1041. The
    subject is the geometry of polynomial lemniscates, of interest to geometric function
    theory; novelty is unassessed. Fibre selection and assembly of the selected
    displacements into a lifted path remain outside Lean.
  authors: ["Will Cook"]
