version: "v0.4"

project:
  name: "Erdős #1041: global two-root critical proximity and exact straight-line obstructions"
  description: >-
    For every degree n at least two and every list of n complex roots, at a critical point
    that is not a root the two distances to some pair of distinct root occurrences sum to at
    most twice the geometric mean of all root distances. In the unit-disk regime the two
    smallest distances d at most e at a critical point satisfy d + e at most 2 whenever the
    inverse-square budget N at most (1 - t^2)(1/d^2 + (N-1)/e^2), the reciprocal balance e
    at most (N-1)d, and the diameter bound e at most 1 + t hold, for every real N at least
    two and every t less than one. A strict diameter margin e less than 1 + t upgrades that
    conclusion to d + e strictly less than 2. For the explicit monic cubic z^3 - (99/100)^3
    the midpoint of every pair of distinct roots lies strictly outside the unit lemniscate,
    an exact countermodel to universal straight-line containment. A second exact rational
    certificate gives escape at one tenth along the unique nearest spoke of the source
    quintic construction, whose reciprocal-balance and uniqueness components are separate
    source theorems. The mechanism is the vanishing sum of reciprocals at a critical point
    converted into an inverse-square budget on the two smallest root distances, which is
    what makes the metric conclusion uniform in the degree, and priority for these
    statements is unassessed. The positive theorems supply distances rather than lemniscate
    containment, the obstruction rules out straight root-pair segments and leaves curved
    paths open, and Erdős #1041 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

