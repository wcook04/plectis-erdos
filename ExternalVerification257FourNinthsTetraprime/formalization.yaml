version: "v0.4"

project:
  name: "Erdős #257: the conditional four-ninths tetraprime counterexample frontier"
  description: >-
    Three Lean-backed endpoints exposing the exact modulus-420 base kernel,
    the repaired-prime defect ceiling, and the reduction from two explicit
    all-depth arithmetic boundaries to an infinite rational Mersenne
    subseries of value 4/9.
  authors:
    - "Will Cook"
  responsible_maintainers:
    - "Will Cook"
  license: "Apache-2.0"

palomar_qualification:
  status: "focused_validation_in_progress_mechanical_replay_pending"
