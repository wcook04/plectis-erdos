  comparator_config: "formal_math/erdos257_period_noncollapse/ExternalVerification257FourNinthsTetraprime/comparator.json"
  repository_scope: "per_family_configuration"
  challenge_dependency_boundary: "Mathlib_only"
  blockers:
    - "the large-prime repair boundary above seven remains unproved"
    - "the uniform five-unit composite margin remains unproved"
    - "the source-current paper revision is staged rather than authoritative"
    - "terminal positive acceptance and deliberate-negative mismatch rejection have not been recorded on a supported runner"
  note: >-
    This package is deliberately admitted because it is a substantial
    conditional counterexample programme with a checked finite kernel and a
    sharp two-obligation all-depth boundary. It does not claim an
    unconditional refutation of Erdős #257.

