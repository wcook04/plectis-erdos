version: "v0.4"
project:
  name: "Erdős #1041: all-degree monic trinomials"
  description: >-
    Let 1 ≤ m < n and f(z) = z^n + a z^m + b be a monic trinomial whose zeros
    all lie in the open unit disc. For any zero ζ the entire radial segment
    from the origin to ζ lies in {|f| < 1}. Distinct zeros ζ₁, ζ₂ are therefore
    joined by the broken line ζ₁ → 0 → ζ₂ of length ‖ζ₁‖ + ‖ζ₂‖ < 2 inside the
    open unit lemniscate. The middle coefficient a is unrestricted beyond the
    Schur-stability already contained in the root hypothesis. The constant-term
    bound ‖b‖ < 1 is derived from Vieta, not assumed. This is the short-note
    Theorem 1 of the Erdős #1041 writeup. Polynomials with more than two
    non-leading terms, and the unrestricted Erdős–Herzog–Piranian problem,
    remain outside the compared declaration.
  authors: ["Will Cook"]
