version: "v0.4"
project:
  name: "Erdős #1041: coefficient and energy criteria forcing two safe tetranomial spokes"
  description: >-
    For a root w of z^m + a z^r + b z^s + c with 1 ≤ s ≤ r ≤ m, ‖w‖ < 1 and ‖c‖ < 1, either
    the root budget ‖c‖ + ‖b‖ ‖w‖^s < 1 or the coefficient-only budget ‖b‖ + ‖c‖ ≤ 1 forces
    the polynomial to have modulus strictly below one at every point of the spoke, the
    segment u w for u in [0,1] from the origin to the root, with the middle coefficient a
    unrestricted. The mechanism is an exact Abel factorisation at the root, which writes the
    value at u w as (1 - u^s) c - (u^s - u^r)(a w^r + w^m) - (u^r - u^m) w^m. An exact
    signed mixed-moment identity, ∑ᵢ |c + b vᵢ|² = |S| |c|² + |b|² ∑ᵢ |vᵢ|² + 2 Re(conj(c) b
    ∑ᵢ vᵢ), promotes those pointwise budgets to a global L2 energy. When |S| ≥ 2 and that
    energy is strictly below |S| - 1, two distinct indices satisfy ‖c + b vᵢ‖ < 1. For a
    finite indexed family of roots in the open unit disk with signed moment ∑ᵢ wᵢ^s, the
    coefficient budget |S| (‖b‖² + ‖c‖²) + 2 Re(conj(c) b moment) < |S| - 1 selects two
    distinct indices whose complete spokes stay strictly inside the unit lemniscate, which
    closes the chain from an algebraic budget to a geometric selection for the centred
    tetranomial family. The subject is the geometry of polynomial lemniscates, of interest
    to geometric function theory; novelty is unassessed. Injective root indexing, cyclic
    lifting of the selected spokes and final path assembly remain outside Lean, and distinct
    indices are distinct root values only under injectivity.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]
