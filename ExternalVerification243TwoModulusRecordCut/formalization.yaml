version: "v0.4"

project:
  name: "Erd\u0151s #243: the two-modulus record cut and its sharpness at jump five"
  description: >-
    Two declarations. The finite cut shows that no primitive step crosses a
    height congruent to five modulo six with a jump of at most four, when two
    moduli greater than one divide the height and the height plus two and both
    divide the next reduced denominator. The orbit form assumes those moduli
    persist in the reduced denominator and every record-setting jump is at most
    four, and concludes that the orbit never reaches the height. Persistence is
    a hypothesis, the cut is sharp at jump four, and Erdős #243 remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

palomar_qualification:
  status: "candidate_pending_mechanical_gates"
  selected_project: "formal_math/erdos257_period_noncollapse"
  comparator_config: "formal_math/erdos257_period_noncollapse/ExternalVerification243TwoModulusRecordCut/comparator.json"
  formalization_metadata: "formal_math/erdos257_period_noncollapse/ExternalVerification243TwoModulusRecordCut/formalization.yaml"
  repository_scope: "private_source_not_yet_pinned_in_public_repository"
  challenge_dependency_boundary: "Mathlib_only"
  replay_status: "terminal_positive_and_deliberate_negative_pair_pending_supported_runner"
  research_interest_status: "plausible_research_note_grade_conditional_result"
  submission_authorization: "operator_directed_submission_campaign_exact_public_identity_pending"
  blockers:
    - "result packet is not present in a public repository at a pinned full commit SHA"
    - "Lean elaboration of Challenge, Solution, NegativeSolution and AxiomAudit has not been run in this pass; the host build slot was occupied and the check is deferred to the next governed build"
    - "terminal positive acceptance and deliberate-negative mismatch rejection have not been recorded on a supported runner"
  note: >-
    This extends the odd protected cut of PrimitiveRecordBarrier from record
    jumps of size at most two to size at most four, replacing the prime-power
    protection machinery by bare persistence hypotheses. It is a cut, not a
    supply lemma, and it dominates no packaged entry.

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A63", "11A05", "11B37"]

sources:
  - title: "The two-modulus record cut for reciprocal tail dynamics"
    authors:
      - "Will Cook"
    type: "original-proof"
    relationship: "other"
    note: >-
      One forbidden landing no longer suffices once jumps reach four, because
      there are five candidate landings. Two moduli kill two of them against
      coprimality of the next pair; the congruence on the height does the rest,
      since it makes the height plus one divisible by six and so collide in turn
      with the three numerators three, two and one below the height. The source
      module also records a genuine primitive step that crosses both forbidden
      landings in a single jump of size five, so no purely congruential
      strengthening of these hypotheses extends the cut.
    license: "Apache-2.0"
    author_endorsement: "participated"
  - title: "Erdős Problem #243"
    authors:
      - "Thomas F. Bloom"
    id: "https://www.erdosproblems.com/243"
    type: "web discussion"
    relationship: "background"
    note: >-
      The catalogue supplies the problem statement, numbering, references and
      open status. The result below is not attributed to the catalogue.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Mathlib"
    authors:
      - "The mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    relationship: "background"
    license: "Apache-2.0"
    author_endorsement: "n/a"

