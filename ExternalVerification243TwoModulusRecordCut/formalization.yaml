  main_results:
    - declaration: "Erdos249257.ExternalVerification243TwoModulusRecordCut.two_modulus_cut"
      file: "ExternalVerification243TwoModulusRecordCut/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243TwoModulusRecordCut/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `two_modulus_cut` in ErdosProblems/Erdos243/TwoModulusRecordCut.lean, committed at 447d8f4b1b8d6c46e75d41276fc92e79323a7500
        (module SHA-256 c7d890fc04e2700d01f4e7edcc37e37c38d3cf489be421f0affa0c96e3f23bad). This packaging pass did not run Lean;
        elaboration is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "finite congruential cut on one primitive crossing step"
      statement: >-
        If `H % 6 = 5`, `m ∣ H`, `l ∣ H + 2`, `1 < m`, `1 < l`, `m ∣ v'`,
        `l ∣ v'`, `Nat.Coprime u' v'`, `Nat.Coprime u u'`, `u < H`, `H ≤ u'` and
        `u' ≤ u + 4`, then `False`.
      boundary: >-
        The cut is sharp at jump four. The source module records the primitive
        step `u = 33`, `v = 7585`, `a = 231`, `u' = 38` crossing `H = 35` past
        both forbidden landings with coprime endpoints in one jump of size five,
        so no purely congruential strengthening of these hypotheses reaches jump
        five. It settles nothing about Erdős #243.
      comparator_declaration: "Erdos249257.ExternalVerification243TwoModulusRecordCut.two_modulus_cut"
      literature_dependencies: []
    - declaration: "Erdos249257.ExternalVerification243TwoModulusRecordCut.two_modulus_record_cut"
      file: "ExternalVerification243TwoModulusRecordCut/Solution.lean"
      sorry_count: 0
      comparator_config: "ExternalVerification243TwoModulusRecordCut/comparator.json"
      canonical_claim_status: "source_proved_wrapper_pending_focused_check"
      local_proof_provenance: >-
        Source theorem `two_modulus_record_cut` in ErdosProblems/Erdos243/TwoModulusRecordCut.lean, committed at 447d8f4b1b8d6c46e75d41276fc92e79323a7500
        (module SHA-256 c7d890fc04e2700d01f4e7edcc37e37c38d3cf489be421f0affa0c96e3f23bad). This packaging pass did not run Lean;
        elaboration is pending the next governed build.
      novelty_status: "unassessed"
      contribution_class: "conditional orbit-level height cut under assumed modulus persistence"
      statement: >-
        Under the primitive-step relations from an index `s`, with `1 < m`,
        `1 < l`, `H % 6 = 5`, `m ∣ H`, `l ∣ H + 2`, `m ∣ v n` and `l ∣ v n` for
        all `n ≥ s`, `runningMax u s < H`, and every record-setting step from `s`
        rising by at most four, the orbit satisfies `u n < H` for all `n ≥ s`.
      boundary: >-
        Persistence of the two moduli in the reduced denominator is a hypothesis,
        not a conclusion. Discharging it for primes that never leave the
        denominator is an open analytic input of the same shape as the supply
        hypothesis of the odd protected cut. No hypothesis is imposed at
        non-record steps and no bound is imposed on the cancellation factors.
        Erdős #243 remains open.
      comparator_declaration: "Erdos249257.ExternalVerification243TwoModulusRecordCut.two_modulus_record_cut"
      literature_dependencies: []


