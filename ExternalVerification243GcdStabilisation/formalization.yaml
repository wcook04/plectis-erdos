# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #243: gcd stabilisation and reduction along an exact reciprocal-tail orbit"
  description: >-
    Conditional theorem in pure Nat/Int vocabulary. Along an exact
    product-cleared orbit whose negative centred errors admit one common bound
    along a cofinal set of indices, the tail gcd is eventually a constant
    positive g, and division by g yields a reduced exact tail: positive
    quotients, coprime quotients, and both original recurrences. Positivity of
    the numerators is derived from the cofinal negative errors, not assumed.
    This is one arithmetic ingredient of the rigidity argument; Erdos #243
    remains open.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

