version: v0.4
project:
  name: Central free-point geometric mean in every positive degree
  description: For every positive number m of complex points of norm at most sqrt(1-exp(-2)),
    the sum of geometric row means of the factors norm(1-conj(c_j)*c_k) is at most
    m. The radius restriction is essential to this entry. No equality classification
    or full unit-disk claim is asserted.
