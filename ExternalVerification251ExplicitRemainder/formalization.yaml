version: "v0.4"

project:
  name: "Erdős #251: an explicit quartic remainder bound with two finite certificates"
  description: >-
    The truncation error between a finite signed prime-gap window of length L and the
    complete real tail shift it approximates is at most 1250 times 2 to the minus L times
    the sum of P at N+h+L+2 and P at N+L+2, where P is the explicit quartic
    x^4 + 8x^3 + 36x^2 + 104x + 150. The constant is evaluated rather than carried. Two
    finite certificates follow: a small window with a small bound keeps the shift inside the
    open unit interval, and a window farther from the integers than the bound makes the
    shift non-integral. The bound is unconditional and it exhibits no block meeting either
    certificate, so it does not settle Erdős Problem 251.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

