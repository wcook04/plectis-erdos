version: v0.4
project:
  name: Two roots of a normalized cubic in the closed unit disc
  description: For every complex b with norm(1 - b^3/2) at least one, z^3 - (3/2)b
    z^2 + 1 has two distinct roots of norm at most one. The condition includes equality.
    This is a normalized cubic root-count statement; it asserts no path, path-length
    bound, or general-degree theorem.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
