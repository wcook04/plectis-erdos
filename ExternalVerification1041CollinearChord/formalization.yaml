version: "v0.4"

project:
  name: "Erdős #1041: straight-chord selection from quantitative collinear critical-gap data"
  description: >-
    Three declarations are compared. The strongest fixes a natural number n at least two, a
    complex polynomial p, a real number D with 0 < D < 2, and a nonempty finite index type
    iota, and assumes quantitative collinear critical-family data for p at diameter D and
    level (D/2)^n / 2^(n-2). That data assigns to each index one critical point and two
    distinct roots of p, bounds the distance between those two roots by D, bounds the product
    over all indices of the moduli of p at the critical points by the level raised to the
    cardinality of iota, and bounds the modulus of p along the straight segment joining the
    two roots by the modulus of p at the paired critical point. Under those hypotheses some
    index carries two distinct roots of p joined by a straight segment on which the modulus
    of p is strictly below one, with the two roots at distance strictly below two. That is
    the conclusion shape of Erdős Problem 1041 for the selected pair of roots. The second
    declaration proves the same selection at an arbitrary positive diameter: for every D
    greater than zero the same data at level (D/2)^n / 2^(n-2) yields an index whose two
    distinct roots lie at distance at most D and whose joining segment carries modulus of p
    at most that level. The third declaration is the single-pair consumer. A collinear peak
    certificate for p at points a, b, c consists of dist a b < 2, modulus of p at c strictly
    below one, and domination of the modulus of p along the segment from a to b by the
    modulus of p at c; from that certificate the modulus of p is strictly below one along the
    whole segment and dist a b < 2. The critical-family fields, in particular the critical
    product bound and the segment domination, are hypotheses of all three declarations. No
    declaration constructs such a family from a polynomial. The interval Fekete, resultant,
    and real-root interlacing arguments that supply those fields sit outside the Lean
    statements. The mechanism inside Lean is finite geometric-mean selection: a product of
    Fintype.card iota nonnegative reals bounded by the level raised to that cardinality has
    a term at most the level, and the arithmetic bound (D/2)^n / 2^(n-2) < 1 for 0 < D < 2
    and n at least two turns the selected term into the strict lemniscate conclusion. This
    theorem family is the first presentation recorded in the development and its novelty is
    unassessed. The hypotheses remain hypotheses, so Erdős Problem 1041 is untouched, and the
    remaining problem is to derive the critical-family data from an actual collinear-root
    polynomial.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

