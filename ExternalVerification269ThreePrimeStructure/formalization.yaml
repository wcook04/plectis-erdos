version: "v0.4"

project:
  name: "Erdős #269: exact three-prime running-LCM identity and infinite kernel rank"
  description: >-
    The running-LCM kernel is K(i,j,k) = 1 / (p^a q^b r^c) with a, b, c the Nat.log
    exponents of N = p^i q^j r^k in the bases p, q, r. Eight declarations are compared.
    The strongest is stated for arbitrary generators. For natural numbers p, q, r each
    greater than 1 such that no positive integer multiple of logb r p is an integer and
    no positive integer multiple of logb r q is an integer, and for every order n, there
    are injective index families I, J from Fin n to the naturals whose n by n minor
    det K(I a, J b, k) is nonzero simultaneously for every value of the third exponent k.
    Distinct primes satisfy that independence hypothesis: for primes p, q, r with p
    different from r and q different from r, the same uniform nonsingular minors exist at
    every order, and for every d there is no representation K(i,j,k) = sum over l < d of
    f_l(i) G_l(j,k) by finitely many separated factors. That pair carries no hypothesis
    relating p and q. For pairwise distinct primes p, q, r and every nonzero x, the least
    common multiple of all smooth numbers p^i q^j r^k at most x equals p^(log_p x)
    q^(log_q x) r^(log_r x), the product of the three maximal pure prime powers below x.
    For pairwise distinct primes p, q, r the first m positive jump values across the three
    prime channels number exactly 3m. Two declarations hold for arbitrary natural
    generators with no hypothesis at all: K is constant on every logarithmic cell, and the
    sum of K over a finite exponent box equals the sum over the genuine running-LCM heights
    of the fibre cardinality divided by the height. A multiplicative shell of width factor
    r inside a sorted exponent budget hp at most hq at most hr summing to j satisfies 9
    times its cardinality at most (j+3)^2, on the hypotheses that r is positive and the
    shell width hi is at most r times lo. The smallest 2, 3, 5 kernel rectangle has
    determinant exactly -1/15. The running-LCM factorisation identity for every finite
    prime set, and the two-prime case in which the series factorises and is transcendental
    by Hecke and Mahler, are due to Steve Fan (erdosproblems.com/269 comment, 26 June
    2026), who also records that the factorisation does not extend to three or more primes.
    The identity theorem here formalises his identity at three primes, and the rank
    statements are the addition. Priority for the rank statements is unassessed. None of
    the eight declarations yields irrationality or transcendence, and Erdős #269 remains
    open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

