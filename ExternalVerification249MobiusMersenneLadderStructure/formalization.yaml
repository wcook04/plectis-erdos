version: v0.4
project:
  name: 'Erdős #249: no finite linear recurrence for the Möbius-Mersenne power ladder, and its separation
    from the literal Möbius-Lambert ladder'
  description: The Möbius-Mersenne power ladder Theta_r is the sum of mu(d)/(2^d - 1)^r over integers
    d at least 1, and the literal Möbius-Lambert ladder Theta-hat_r is the sum of mu(d)/(2^(r d) - 1)
    over integers d at least 1. The power ladder satisfies no finite constant-coefficient linear recurrence.
    For every order m, every real coefficient vector c on Fin (m+1) with at least one nonzero entry, and
    every threshold n_0, the assumption that the sum over k of c_k Theta_{n+k} vanishes for all n at least
    n_0 is contradictory, and the same conclusion is recorded at threshold 1. At every rung r at least
    1 the power ladder is strictly log-concave, Theta_r Theta_{r+2} < Theta_{r+1}^2, and its shifted order-two
    Hankel determinant Theta_r Theta_{r+2} - Theta_{r+1}^2 is strictly negative. The literal Lambert ladder
    collapses, Theta-hat_r = 2^{-r} for every r at least 1, and for every shift s at least 1 and every
    order N at least 2 the determinant of the matrix with entries Theta-hat_{s+i+j} indexed by Fin N is
    zero. The assertion that the two ladders agree at every rung r at least 1 is therefore false. The
    nontrivial input is the atomic resummation of Theta_r as the signed sum of r-th powers of the strictly
    decreasing Mersenne atoms 1/(2^(j+1) - 1), together with the peeling of the least atom at which the
    recurrence polynomial is nonzero, and the substitution q = 2^{-r} into the Möbius-Lambert collapse
    identity, whose shifted Hankel matrices are rank-one outer products. This theorem family is the first
    presentation recorded in the development and its novelty is unassessed. The arithmetic identity phi
    = mu * id that routes Erdős Problem 249 to this ladder is recorded in a comment by Steve Fan on the
    catalogue entry for Problem 249, and the ladder structure proved here is not attributed to that comment.
    No declaration here asserts a measure representation for either ladder, a rank statement for the infinite
    Hankel matrix, or any irrationality conclusion, so Erdős Problem 249 remains open.
