version: "v0.4"

project:
  name: "Erdős #1049: sharp rational gaps for integral linear forms and the exterior-determinant height tradeoff"
  description: >-
    At a rational target a/q with q positive, two integral coefficient rows whose exterior
    determinant A_1 B_2 - A_2 B_1 is nonzero cannot both have remainder below 1/q: at least
    one of |B_1 (a/q) - A_1| and |B_2 (a/q) - A_2| is at least 1/q. The one-row statement
    gives |B (a/q) - A| ≥ 1/q for every integral linear form that does not vanish at a/q.
    Both gaps follow from nonvanishing alone, with no primality, no denominator support
    condition, and no coprimality between a and q. Two real remainders at most epsilon at a
    common real target F bound the exterior determinant by |A_1 B_2 - A_2 B_1| ≤ epsilon
    (|B_1| + |B_2|), with no change of basis and no coefficient-height hypothesis. Under a
    real change of basis whose determinant has absolute value 1 and whose four entries are
    bounded by H, the same argument gives |A_1 B_2 - A_2 B_1| ≤ 2 H epsilon (|B_1| + |B_2|),
    so joint decay through a bounded recombination is paid for in determinant size, and
    integer-unimodular recombination is a special case. Along any sequence of integral row
    pairs whose exterior determinant is nonzero at every index, the two real linear forms
    cannot both tend to zero at a rational target, so no such pair of selectors jointly
    witnesses vanishing. Three further declarations record the q-Apéry-facing arithmetic
    interfaces to these gaps. A prime l dividing B and dividing neither A nor q forces
    |B (a/q) - A| ≥ 1/q, and the same gap follows from l^r | B for any exponent r ≠ 0 under
    the same conditions on A and q. For a pair of rows, if l divides both B_1 and B_2, l
    divides neither q, and l^2 does not divide the exterior determinant A_1 B_2 - A_2 B_1,
    then at least one of the two rows has the full 1/q gap. In each of these three the prime
    data certifies the nonvanishing that the unconditional gaps take as hypothesis. When
    every denominator coordinate vanishes modulo N the pigeonhole only has to see the
    numerator coordinate, so N < 2^k already forces a nontrivial binary selector collision in
    both coordinates. For a q-Apéry approach to the Lambert value at 3/2 the hypotheses these
    declarations do not supply are prime or prime-power support in the
    denominator coordinates that persists cofinally, together with determinant control that
    survives recombination; the ancestry is the classical Apéry-style linear-form argument,
    and priority is unassessed. Producing that cofinal support for the actual q-Apéry rows,
    the analytic decay, and irrationality at 3/2 remain open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

