version: "v0.4"
project:
  name: "Erdős #68: explicit cubic radius floor for simultaneous factorial channel cancellation"
  description: >-
    A channel is an index d at least 2 carrying the modulus d! - 1, obtained by
    reweighting each factorial term of the series so that the powers of d! divide out;
    the channel test at d compares that reweighted integer with the factorial moment
    modulo d! - 1. Six declarations are compared. The sharpest is explicit: for every t
    at least 2^32 and all natural numbers M and R with M positive, M divisible by the
    least common multiple of d! - 1 over 2 ≤ d ≤ 2t^2, and M < (R+1)! - 1, the support
    radius satisfies 3t^3 < 2(R+1). The same hypotheses imposed from t = 4096 onwards
    give t^3 < 8(R+1), which is the explicit bound available on 4096 ≤ t < 2^32.
    Imposing each hypothesis set at every large t gives the sequence forms: no radius
    function can eventually satisfy 2(R(t)+1) ≤ 3t^3, no radius function can eventually
    satisfy 8(R(t)+1) ≤ t^3, and R(t)+1 is not o(t^3). The sixth declaration evaluates
    the finite logarithmic constraint that produces these bounds at the value
    R+1 = (16/9)t^3 and proves that for every t at least 4 the constraint is satisfied
    there. That declaration bounds no support radius. It establishes that the
    logarithmic constraint alone does not force a lower bound at the constant 16/9,
    while the constant proved on this subsequence is 3/2. The subcubic range is closed
    on the square subsequence D = 2t^2, since every finite channel system meeting the
    hypotheses carries support radius above (3/2)t^3. The nontrivial input is a finite
    lower estimate for the channel least common multiple, in which consecutive numbers
    d! - 1 are combined while their pairwise gcd losses are counted explicitly, and a
    Stirling bound converts that estimate into the cubic radius. This theorem family is
    the first presentation recorded in the development and its novelty is unassessed.
    The divisibility and factorial bounds remain hypotheses, so the irrationality
    question in Erdős Problem 68 is untouched, and the remaining problem is to derive
    those hypotheses from the factorial-gap series and to prove that the required
    channels vanish.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]
