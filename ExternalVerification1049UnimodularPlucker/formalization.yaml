# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #1049: unimodular Bézout--Plücker tail collapse and its modular width"
  description: >-
    Over an arbitrary commutative ring, a sequence of rows whose entries are coprime in the Bezout sense and whose adjacent two-by-two minors all vanish has every pairwise minor equal to zero. The hypothesis is unimodularity of the row, not invertibility of a coordinate: the row (2,3) is unimodular modulo 6 while neither entry is a unit, so this strictly extends the unit-coordinate form already recorded for this project. Specialising to the ring of integers modulo 2^S times 3^R with R positive, the collapse forces two distinct binary selectors on Fin k to have equal selected row sums whenever S + 2R is at most k, so the sufficient width is S + 2R rather than the ambient two-coordinate width 2S + 4R. The readers are number theorists and arithmetic-geometry formalisers working on rank-two approximation lattices. This is a structural lemma about integral rows; it supplies no irrationality conclusion and it does not settle Erdős Problem 1049.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

