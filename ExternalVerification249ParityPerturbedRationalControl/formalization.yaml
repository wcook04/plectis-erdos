version: v0.4
project:
  name: 'Erdős #249: a parity-perturbed rational control for the binary totient
    series'
  description: >-
    The binary totient series is the sum over n at least 1 of φ(n)/2^n, and Erdős
    Problem 249 asks whether that value is irrational. Five declarations are compared.
    The strongest exhibits one explicit sequence c of natural numbers and proves four
    properties of it together: c n is at most n for every n, c n equals φ(n) at every
    odd n, the absolute value of c n minus φ(n) is at most 2 for every n, and the
    binary series of c is exactly 5/4. A second declaration isolates that value
    identity, and a third records that the binary series of c is rational. The fourth
    declaration produces for that same c a positive natural number v and an integer
    sequence u satisfying the exact carry recurrence u(N+1) = 2u(N) - v·c(N+1) with
    u(N)/2^N tending to zero, and proves that for every e the canonical dyadic carry
    sections of u through levels 1 to e span a rational vector space of dimension at
    least 2^e - 1. The fifth declaration is the general form behind it: for every
    coefficient sequence agreeing with φ at every odd argument, every positive v, and
    every tempered integral binary orbit u of that sequence, the same rank bound
    2^e - 1 holds at every level e. The construction is a centred base-four expansion
    with digit set {-2, -1, 0, 1} applied to 5/4 minus the binary totient series and
    deposited at the even arguments, so the odd arguments carry the totient unchanged
    and every odd dyadic section of c is the corresponding odd totient section. These
    declarations bound method. Every hypothesis of the carry anti-compression theorem,
    and its conclusion, holds for a sequence whose series is the rational number 5/4,
    so an irrationality proof for the binary totient series requires an input beyond
    the carry recurrence, temperedness, the growth bound c n ≤ n, and the odd totient
    channels. Any such proof must separate φ from a sequence that agrees with it at
    every odd argument and differs from it by at most 2 at the even arguments. Nothing
    here bears on whether the binary totient series is irrational, and Erdős Problem
    249 remains open. This theorem family is the first presentation recorded in the
    development and its novelty is unassessed.
