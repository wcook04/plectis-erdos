editorial_assessment:
  plectis_signal: >-
    These two lemmas are the frame in which every finite certificate search for the
    binary totient series is stated. Soundness says what a window has to show, and
    the period law says exactly which denominators a window of step h can address.
    Together they fix the search space without narrowing it.
  prior_art_state: >-
    Both are the standard separation and periodicity arguments for binary expansions
    of rationals, stated for an arbitrary index-bounded coefficient sequence. No
    exact prior statement in this generality has been located, and neither is
    presented as novel.
  sharpness_gap: >-
    The certificate radius N + h + L + 2 is the one carried by the long record. No
    declaration here shows it cannot be reduced, and no declaration here supplies a
    window that meets it for the totient sequence.
