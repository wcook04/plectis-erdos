version: v0.4
project:
  name: 'Erdős #249: certificate soundness and the rational tail-period law for
    binary coefficient sequences'
  description: >-
    Two declarations are compared, both about a coefficient sequence c from the
    naturals to the naturals with c n at most n, whose binary value is the sum over
    n at least 0 of c (n+1) / 2^(n+1) and whose scaled tail at height N is the sum
    over j at least 0 of c (N + j + 1) / 2^(j+1). The first is certificate
    soundness. The length-L integer window comparing the block after N + h with the
    block after N has discrepancy given by the alternating weighted sum; if that
    discrepancy lies strictly between N + h + L + 2 and 2^L minus that quantity
    modulo 2^L, then the tail shift at N of step h is not an integer. The second is
    the rational tail-period law. If the binary value equals p / (2^e * m) with m
    positive and m dividing 2^h - 1, then for every N at least e the tail shift at N
    of step h is an integer. The certificate radius is unchanged from the long
    record and the ambient growth hypothesis is explicit. Neither declaration
    supplies a certificate for any particular sequence, neither asserts anything
    about the value of the totient series, and Erdős Problem 249 remains open.
