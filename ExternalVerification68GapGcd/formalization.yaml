version: "v0.4"

project:
  name: "Erdős #68: factorial-gap quotient gcd and terminal-block segment inequality"
  description: >-
    Two finite arithmetic statements about the factorial gaps n! - 1. The first fixes the
    gcd of two gaps: for 2 <= i < j the gcd of i! - 1 and j! - 1 divides the quotient gap
    j!/i! - 1, is bounded above by it, and that quotient is strictly smaller than
    j^(j-i). The second bounds a terminal block of length k ending at N: the sum of the
    logarithms of the moduli over that block is at most the logarithm of the common
    denominator lcm of d! - 1 over 2 <= d <= N, plus a collision term binom(k+1, 3) log N,
    one factor for each pair in the block. The mechanism for the first is the identity
    j!/i! = descFactorial j (j - i) together with reduction of j! - 1 modulo i! - 1; the
    second is the logarithm of an integer product-lcm-gcd inequality, with the interval
    identity between the recursive block product and the Finset.Icc sum proved rather than
    assumed. The readers are number theorists working on irrationality of factorial
    reciprocal sums. Priority has not been assessed. Both theorems bound a common
    denominator, not a reduced one, and neither decides the rationality of the sum of
    (n! - 1)^{-1}.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

