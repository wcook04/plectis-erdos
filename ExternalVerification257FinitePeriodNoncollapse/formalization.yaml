version: "v0.4"

project:
  name: "Erdős #257: exact multiplicative-order noncollapse at every integer base"
  description: >-
    For every finite nonempty set F of positive exponents and every integer base b at least
    two, the reduced denominator Q of the rational number given by the sum of 1/(b^n - 1)
    over n in F is coprime to b, and the multiplicative order of b modulo Q is exactly the
    lcm of F. The conclusion is an equality and it is uniform: it holds for all such F and
    all such b simultaneously, with no coprimality, parity, spacing or size hypothesis on F
    beyond nonemptiness and exclusion of the zero exponent. Reduction to lowest terms
    therefore destroys none of the period carried by the unreduced product denominator.
    Whenever the lcm of F is at least two, the reduced denominator strictly exceeds it, so
    along any increasing exhaustion of an infinite support the reduced denominators of the
    partial sums grow without bound. The mechanism is a cyclotomic construction of
    prime-power divisors of Q realising the exact order, which pins the order at the lcm for
    every base at once, an equality where the easy direction gives only divisibility. The
    readers are number theorists working on irrationality of Mersenne-type reciprocal sums;
    priority for the theorem has not been assessed. The theorem is finite-support, and it
    supplies no infinite-support irrationality argument for Erdős Problem 257.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

