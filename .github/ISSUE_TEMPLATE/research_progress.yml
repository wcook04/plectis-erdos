name: Research progress or correction
description: Share useful work in ordinary language; no receipt or command output is required.
title: "[research progress] "
labels: ["research-return"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you found in your own words. A proof correction, counterexample,
        failed route, clearer explanation, source correction, or reproducible tooling
        improvement can all be useful. If you have a branch or patch, link it. The
        maintainers can record exact credit and history if the work is accepted. If
        an agent says it found a solution, report that as a candidate and show the
        evidence; do not upgrade the claim on the agent's confidence alone.
  - type: textarea
    id: question
    attributes:
      label: What question or problem were you working on?
      description: Name the Erdős problem, paper, proof, or repository issue if you know it.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: What did you find or change?
      description: Explain the result, correction, obstruction, or improvement in ordinary language.
    validations:
      required: true
  - type: dropdown
    id: evidence_class
    attributes:
      label: What is the strongest evidence class reached so far?
      description: Choose the narrowest accurate answer. This controls triage, not credit.
      options:
        - Unreviewed person or agent lead
        - Reproducible finite computation
        - Lean accepts the stated formal declaration
        - Independent replay or adversarial check
        - Qualified human mathematical review
        - Correction, reference, exposition, or scoped negative result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What can another person inspect or replay?
      description: Link a branch, pull request, patch, source, calculation, or describe how you checked it.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: What remains unresolved or uncertain?
      description: State assumptions, limits, failed checks, or questions that survive.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      description: Give the name or handle you want attached to accepted work.
    validations:
      required: true
  - type: checkboxes
    id: public_material
    attributes:
      label: Public-material confirmation
      options:
        - label: I have not included credentials, private correspondence, personal data, or unpublished material that should remain private.
          required: true
        - label: I understand that submission, reproducibility, or Lean acceptance does not by itself establish intended meaning, novelty, a solved Erdős problem, peer review, or community acceptance.
          required: true
