name: Structured research return
description: Agent or advanced route for a replayable, machine-validated research package.
title: "[research return] "
labels: ["research-return"]
body:
  - type: markdown
    attributes:
      value: |
        This is the structured route for agents and contributors who already
        have a return package. To share useful work in ordinary language, use
        the [research progress or correction form](research_progress.yml)
        instead; the repository can produce the receipt during assimilation.

        Use this form for a public return from a cited repository generation.
        For the complete field-by-field contract, copy
        `docs/research-commons/RETURN_PACKAGE_TEMPLATE.md`. Do not include
        private paths, credentials, caches, correspondence, or unpublished
        proof material; use the security route for sensitive reports.
        Canonical routes: [contributor guide](../../CONTRIBUTING.md),
        [return contract](../../docs/research-commons/RETURN_PACKAGE_TEMPLATE.md),
        [resume and replay state](../../docs/research-commons/RETURN_PACKAGE_TEMPLATE.md#4-evidence-and-replay),
        [bounded frontier route](../../docs/research-commons/RETURN_PACKAGE_TEMPLATE.md#2-bounded-route), and
        [accepted contributions](../../docs/research-commons/CONTRIBUTIONS.md).
        Choose the frontier recorded in `return.json`: one numbered problem, a
        mathematical subject spanning zero or more problems, or an architecture
        area. A subject or architecture return must not invent a problem number.
        For a numbered problem, inspect its material result families and exact
        open boundary in the [problem index](../../docs/problems.json). For a
        subject, use the [subject frontier](../../docs/research-commons/RETURN_PACKAGE_TEMPLATE.md#subject-frontier).
        For architecture, use the [architecture contribution path](../../docs/research-commons/ARCHITECTURE_CONTRIBUTIONS.md#architecture-contribution-path).
        These routes navigate the work; they do not turn activity into credit.
        After acceptance, inspect the [accepted-receipt recognition and impact
        view](../../docs/research-commons/CONTRIBUTION_RECOGNITION.md) and its
        [machine-readable projection](../../docs/research-commons/contribution-recognition.json).
        They preserve separate contributor, operator, collaborator, model, and
        provider identities, exclude unaccepted work, and do not rank activity.
        Use [`scripts/continue_research.py`](../../scripts/continue_research.py)
        for session and package transitions and
        [`scripts/validate_research_return.py`](../../scripts/validate_research_return.py)
        before submitting. If the return would change a reviewed claim, consult
        the [methodology](../../docs/methodology.json). To report a defect
        without a return package, use the [broken source or paper link](broken_link.yml)
        form for navigation defects, or the
        [mathematical discrepancy](math_discrepancy.yml) form for disagreements
        about a checked proposition or authority interpretation. Submit a
        packaged correction here.
  - type: textarea
    id: return_json
    attributes:
      label: Machine-readable return
      description: >-
        Paste the complete `return.json` produced by
        `scripts/continue_research.py package`, or an equivalent document
        conforming to the tracked receipt schema. For every track, run
        `python3 scripts/validate_research_return.py return.json
        --require-submitted --check-git`. For a mathematical problem or subject,
        also pass `--require-route-memory-receipt --route-memory-receipt
        route-memory.json`. Architecture packages do not have route-memory.json.
        When `proposed_commit` is set, also pass
        `--require-complete-proposed-diff`. Validate in the contributor checkout
        containing the recorded commits; issue submission itself does not run
        these commands or accept the return.
      render: json
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: Contributor name or handle
      description: The name or handle to credit for the returned artifact.
    validations:
      required: true
  - type: textarea
    id: route_memory_json
    attributes:
      label: Route-memory receipt
      description: >-
        Required for a mathematical problem or subject return: paste the
        complete `route-memory.json` produced beside `return.json`. Validate
        the pair with `--require-route-memory-receipt --route-memory-receipt
        route-memory.json`. Leave this field empty for an architecture return:
        its package contains a workflow consultation instead. GitHub issue
        forms cannot require this field conditionally; maintainers check the
        track-specific package before acceptance.
      render: json
    validations:
      required: false
  - type: input
    id: starting_commit
    attributes:
      label: Starting commit
      description: >-
        The full commit from which this return started, matching
        `return.json`'s `repository.starting_commit`. It may differ from the
        current checkout HEAD after work is committed.
      placeholder: 40-character commit hash
    validations:
      required: true
  - type: input
    id: frontier_route
    attributes:
      label: Frontier and exact route
      description: >-
        For a numbered problem, name its claim or remaining-open handle. For a
        subject, name the subject and related problems (which may be none). For
        architecture, name the area, starting paths, and workflow consultation;
        do not assign a fictional Erdős number.
      placeholder: "Problem: #249 and remaining_open...; subject: <name>, related [249,257]; or architecture: navigation, scripts/agent_entry.py"
    validations:
      required: true
  - type: input
    id: result_family
    attributes:
      label: Result family and significance rank
      description: >-
        Record the exact publication-family id and significance rank from the
        complete family census. For subject, architecture, or source-only work
        without a publication family, write not applicable and explain why.
      placeholder: "erdos249_gap_certificate_supply (rank 17), or not applicable — source-only route"
    validations:
      required: true
  - type: textarea
    id: bounded_question
    attributes:
      label: Bounded question and stop condition
      description: State one question that can be replayed, and when to stop.
      placeholder: >-
        Replay the named finite route through the stated parameter range; stop
        at the first missing assumption.
    validations:
      required: true
  - type: textarea
    id: formal_navigation
    attributes:
      label: Formal navigation and evidence handles
      description: >-
        For a numbered problem or subject with formal evidence, record the
        applicable paper, problem, open-frontier, module, claim, declaration,
        and source-coordinate queries. A subject with no related problems must
        not invent a problem selector. For architecture, write not applicable
        and name its workflow consultation and planned checks; do not invent
        mathematical formal evidence. Use --paper-anchor only
        with a canonical label returned by the claim packet; a note title,
        source_path, or paper.source_ref is a reading locator, not a selector.
        For a source-only route, mark paper and claim not applicable and retain
        the available problem, open-frontier, module, declaration, and source handles.
      placeholder: |-
        For mathematical work, list only the applicable route handles:
        python3 scripts/query_corpus.py --paper-anchor <canonical_paper_label>
        python3 scripts/query_corpus.py --problem <number>
        python3 scripts/query_corpus.py --search "all result families"
        python3 scripts/query_corpus.py --publication-family <family_id>
        python3 scripts/query_corpus.py --open <remaining_open.id>
        python3 scripts/query_corpus.py --module <module-or-path>
        python3 scripts/query_corpus.py --claim <claim_id>
        python3 scripts/query_corpus.py --declaration <qualified_declaration>
        python3 scripts/query_corpus.py --source <module>:<positive_line>
        next: use scripts/continue_research.py start/check for the bounded continuation package
        boundary: canonical paper label only; source-only: paper/claim not applicable
        observed: <exact route output and authority boundary>
        For architecture: not applicable — workflow consultation <id>; planned checks <commands>
      render: text
    validations:
      required: true
  - type: textarea
    id: changed_paths
    attributes:
      label: Public artifact and changed paths
      description: List only public paths and describe what a cold reader can inspect.
      placeholder: "docs/...\nArtifact: ..."
    validations:
      required: true
  - type: textarea
    id: source_artifact
    attributes:
      label: Recoverable source package or public patch
      description: >-
        Attach or link the complete structured package (including its `source/`
        files and `package.json`), a public proposed commit, or a reviewable
        patch. Name the return ID and explain how another checkout recovers
        every declared changed path. A pasted `return.json` alone does not carry
        the source change. Do not include private or unpublished material.
    validations:
      required: true
  - type: dropdown
    id: result_class
    attributes:
      label: Result class
      options:
        - Checked positive
        - Negative
        - Inconclusive
        - Correction
    validations:
      required: true
  - type: textarea
    id: conclusion_boundary
    attributes:
      label: Conclusion and surviving boundary
      description: >-
        Give the exact conclusion and say what remains open or unestablished.
        Do not call a finite or conditional result a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Commands and exit states
      description: >-
        Record every command actually run, its exit state, relevant public
        environment, and the exact source or script used.
      render: text
      placeholder: |-
        command: python3 scripts/query_corpus.py --problem <number>
        exit: 0
        observed: <short output>
        environment: <pinned public toolchain, if relevant>
    validations:
      required: true
  - type: textarea
    id: attribution_limits
    attributes:
      label: Attribution, credit, and limitations
      description: >-
        Cite prior work, request credit for the returned artifact, preserve
        existing authorship and licenses, and list assumptions or missing
        review.
    validations:
      required: true
  - type: textarea
    id: correction_lineage
    attributes:
      label: Correction lineage
      description: >-
        For a corrective return, copy the exact `correction_lineage` values from
        return.json: prior return reference, affected paths and starting commit,
        changed evidence or wording, reason, and disposition. If an earlier
        accepted return is superseded or withdrawn, give its exact return ID
        and committed receipt link; a free-text reference alone is not proof
        that it exists. For an original correction, use `none` and request review
        rather than silently superseding a prior artifact. For a non-correction
        return, write not applicable. Maintainers verify the prior receipt and
        public claim transition before acceptance.
      placeholder: |-
        Prior return reference: <none for original correction, or exact rr-id and committed receipt link>
        Affected paths and starting generation: <paths and commit>
        Changed evidence or wording: <what changed>
        Correction reason: <reason or not applicable>
        Correction disposition: <retain|supersede|withdraw|request review>
    validations:
      required: true
  - type: textarea
    id: resume_state
    attributes:
      label: Resume state and next action
      description: >-
        Name the last completed step, one next bounded action, and the stop
        condition for the next contributor.
    validations:
      required: true
  - type: checkboxes
    id: public_safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: >-
            I removed private paths, credentials, caches, personal data,
            correspondence, and unpublished material.
          required: true
        - label: >-
            I am not asking the repository owner to infer novelty, independent
            review, or a solution from this return.
          required: true
        - label: >-
            I understand that a reviewed-claim change requires the
            methodology-defined review and claim-registry transition.
          required: true
  - type: checkboxes
    id: acceptance_boundary
    attributes:
      label: Acceptance boundary
      options:
        - label: >-
            I understand that opening or submitting this issue creates a
            submitted return, not an accepted receipt; until a reviewer
            records and commits an explicit accepted receipt, this work is not
            promoted or included in accepted-only recognition views.
          required: true
