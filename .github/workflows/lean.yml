# SPDX-License-Identifier: Apache-2.0
name: Lean CI

# Two lanes: the Lean build (developer convenience; the kernel check is the
# proof authority) and the release-surface checks (claim registry, paper
# links, citation metadata, scope, licences). Feature branches run through the
# pull-request event only, avoiding a duplicate build for the same commit.
# Main is protected with both jobs required, so every commit that reaches it has
# already passed them on its pull request and a push-triggered rerun would only
# repeat work. If branch protection is relaxed, restore push validation before
# landing anything directly.
on:
  pull_request:
  # Manual dispatch remains the explicit way to revalidate main, a tag, or any
  # other ref without a dummy commit.
  workflow_dispatch:
    inputs:
      scope:
        description: "Validation scope for an immutable release or diagnostic replay"
        required: true
        default: all
        type: choice
        options:
          - all
          - external-verification-only
          - release-surfaces-only

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  # A newer PR head covers the complete base-to-head diff, so its predecessor
  # is redundant. Never cancel main runs: a later documentation-only push must
  # not cancel validation of an earlier direct Lean push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # change gate compares the complete PR or push range
      - name: Detect supported-root Lean changes
        id: lean-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          head="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed=true
          elif git diff --quiet "$base" "$head" -- \
            Erdos249257.lean 'Erdos249257/**' \
            ErdosProblems.lean 'ErdosProblems/**' \
            lakefile.toml lakefile.lean lake-manifest.json lean-toolchain \
            scripts/build_declaration_atlas.py \
            scripts/build_lean_dependency_index.py \
            scripts/export_lean_dependency_edges.lean \
            scripts/lean_fast_build.py \
            scripts/query_corpus.py; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Lean-affecting changes: $changed ($base..$head)"
      - name: Test pinned proof-environment lock
        run: python3 scripts/test_dependency_lock_contract.py
      - name: Test bounded build planner
        run: python3 scripts/test_lean_fast_build.py
      - name: Test dependency-index verification cache
        run: python3 scripts/test_lean_dependency_index_cache.py
      - name: Restore project Lean cache
        if: steps.lean-inputs.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # This top-level action saves after the later custom build has
          # populated project OLeans. Keep the historical lean-action key
          # shape so existing main-branch caches seed the optimized run.
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Install pinned Lean toolchain
        if: steps.lean-inputs.outputs.changed == 'true'
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency build artifacts
        if: steps.lean-inputs.outputs.changed == 'true'
        # Mathlib's own `cache` executable, run by the pinned Lake toolchain
        # rather than a third-party composite action. It fetches oleans only
        # for the dependency revisions already fixed in lake-manifest.json;
        # this repository's own Lean sources are still elaborated locally by
        # the pinned kernel, so proof authority is unchanged. Without it a
        # cold Actions cache must compile Mathlib from source, which cannot
        # finish inside the runner job ceiling.
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Memory-bounded Lean build
        if: steps.lean-inputs.outputs.changed == 'true'
        # Drain independent Lucas modules without Lake's unbounded ready-set
        # fan-out. Lake's own trace hashes validate restored project outputs;
        # final serialized Lake checks remain the proof-authority check.
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness
      - name: Build the problem-centric library
        if: steps.lean-inputs.outputs.changed == 'true'
        # This is already a default root. Keep an explicit warm authority check
        # so the problem-centric root has its own CI receipt after the bounded
        # planner; restored Lake traces make the repeated check cheap.
        run: lake build ErdosProblems
      - name: Build downstream consumer example
        if: steps.lean-inputs.outputs.changed == 'true'
        run: lake build Examples
      - name: Verify elaborated dependency index
        if: steps.lean-inputs.outputs.changed == 'true'
        # The first changed environment performs the full export and writes an
        # exact receipt into .lake. An exact cache restore reuses that receipt;
        # changed formal/exporter inputs force a fresh export.
        run: python3 scripts/build_lean_dependency_index.py --check
      - name: Record documentation-only build skip
        if: steps.lean-inputs.outputs.changed != 'true'
        run: echo "No Lean source or proof-environment input changed; compilation is unchanged."

  external-verification:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'external-verification-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull-request checkout otherwise resolves to GitHub's synthetic
          # merge commit. Comparator receipts are source-review artefacts, so
          # bind them to the contributor-visible head commit instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect external-verification inputs
        id: external-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          else
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            if [[ -z "$base" || -z "$head" ]]; then
              changed=true
            elif git diff --quiet "$base" "$head" -- \
              Erdos249257.lean 'Erdos249257/**' \
              ErdosProblems.lean 'ErdosProblems/**' \
              ExternalVerification 'verification/**' \
              lakefile.toml lakefile.lean lake-manifest.json lean-toolchain \
              docs/claims.json docs/problem_index_source.json docs/problems.json \
              docs/EXTERNAL_VERIFICATION.md docs/external_verification_packet.json \
              formalization.yaml \
              scripts/build_external_verification.py \
              scripts/run_external_verification.py \
              scripts/test_external_verification.py \
              .github/workflows/lean.yml; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "External-verification inputs changed: $changed"
      - name: Initialize failure-safe verification receipt
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          mkdir -p artifacts
          python3 scripts/run_external_verification.py --phase initialized || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.external-inputs.outputs.changed == 'true'
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pinned Lean toolchain
        if: steps.external-inputs.outputs.changed == 'true'
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare trusted challenge inputs
        if: steps.external-inputs.outputs.changed == 'true'
        run: |
          set -euo pipefail
          lake exe cache get
          python3 scripts/test_external_verification.py
      - name: Build pinned Comparator toolchain
        if: steps.external-inputs.outputs.changed == 'true'
        id: tools
        env:
          COMPARATOR_REV: 789279735fe44c1c05dc54bb9f46ba4d9b8c7611
          LEAN4EXPORT_REV: 6f4e21dd70c3c11d7fbd07d39e3192792c657448
          LANDRUN_REV: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout --detach "$COMPARATOR_REV"
          test "$(git -C "$RUNNER_TEMP/comparator" rev-parse HEAD)" = "$COMPARATOR_REV"
          (cd "$RUNNER_TEMP/comparator" && lake build comparator)
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout --detach "$LEAN4EXPORT_REV"
          test "$(git -C "$RUNNER_TEMP/lean4export" rev-parse HEAD)" = "$LEAN4EXPORT_REV"
          (cd "$RUNNER_TEMP/lean4export" && lake build lean4export)
          git clone --filter=blob:none https://github.com/zouuup/landrun.git "$RUNNER_TEMP/landrun-src"
          git -C "$RUNNER_TEMP/landrun-src" checkout --detach "$LANDRUN_REV"
          test "$(git -C "$RUNNER_TEMP/landrun-src" rev-parse HEAD)" = "$LANDRUN_REV"
          (cd "$RUNNER_TEMP/landrun-src" && go build -o "$RUNNER_TEMP/landrun" cmd/landrun/main.go)
          echo "comparator_rev=$COMPARATOR_REV" >> "$GITHUB_OUTPUT"
          echo "lean4export_rev=$LEAN4EXPORT_REV" >> "$GITHUB_OUTPUT"
          echo "landrun_rev=$LANDRUN_REV" >> "$GITHUB_OUTPUT"
          echo "comparator_lean_toolchain=$(tr -d '\r\n' < "$RUNNER_TEMP/comparator/lean-toolchain")" >> "$GITHUB_OUTPUT"
      - name: Run positive and adversarial Comparator checks
        if: steps.external-inputs.outputs.changed == 'true'
        id: comparator
        continue-on-error: true
        run: |
          set +e
          export COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun"
          export COMPARATOR_LEAN4EXPORT="$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export"
          comparator="$RUNNER_TEMP/comparator/.lake/build/bin/comparator"
          systemctl --user show-environment > systemd-user-preflight.log 2>&1
          if [[ $? -eq 0 ]]; then
            sandbox_mode=user-manager
          elif sudo -n systemctl show-environment > systemd-system-preflight.log 2>&1; then
            sandbox_mode=system-manager-nonprivileged-unit
          else
            sandbox_mode=unavailable
          fi
          echo "sandbox_mode=$sandbox_mode" >> "$GITHUB_OUTPUT"
          run_comparator() {
            config="$1"
            if [[ "$sandbox_mode" == user-manager ]]; then
              timeout 20m systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe \
                -E PATH="$PATH" -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
                -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
                --working-directory="$(pwd)" -- lake env "$comparator" "$config"
            elif [[ "$sandbox_mode" == system-manager-nonprivileged-unit ]]; then
              timeout 20m sudo -n systemd-run --property=RestrictAddressFamilies=~AF_UNIX \
                --uid="$(id -un)" --gid="$(id -gn)" --pipe \
                -E PATH="$PATH" -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
                -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
                --working-directory="$(pwd)" -- lake env "$comparator" "$config"
            else
              printf '%s\n' "No usable systemd transient-unit manager; refusing an insecure fallback."
              return 125
            fi
          }
          run_comparator verification/comparator.json \
            > artifacts-positive.log 2>&1
          positive_exit=$?
          run_comparator verification/comparator-negative-mismatch.json \
            > artifacts-negative.log 2>&1
          negative_exit=$?
          echo "positive_exit=$positive_exit" >> "$GITHUB_OUTPUT"
          echo "negative_exit=$negative_exit" >> "$GITHUB_OUTPUT"
          cat artifacts-positive.log
          cat artifacts-negative.log
          exit 0
      - name: Write and enforce commit-bound verification receipt
        if: ${{ always() && !cancelled() && steps.external-inputs.outputs.changed == 'true' }}
        run: |
          positive_exit='${{ steps.comparator.outputs.positive_exit }}'
          negative_exit='${{ steps.comparator.outputs.negative_exit }}'
          [[ -n "$positive_exit" ]] || positive_exit=-999
          [[ -n "$negative_exit" ]] || negative_exit=-999
          python3 scripts/run_external_verification.py \
            --phase final \
            --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}' \
            --positive-exit "$positive_exit" \
            --negative-exit "$negative_exit" \
            --positive-log artifacts-positive.log \
            --negative-log artifacts-negative.log \
            --comparator-rev '${{ steps.tools.outputs.comparator_rev }}' \
            --lean4export-rev '${{ steps.tools.outputs.lean4export_rev }}' \
            --landrun-rev '${{ steps.tools.outputs.landrun_rev }}' \
            --comparator-lean-toolchain '${{ steps.tools.outputs.comparator_lean_toolchain }}' \
            --sandbox-mode '${{ steps.comparator.outputs.sandbox_mode }}' \
            --comparator-bin "$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --lean4export-bin "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" \
            --landrun-bin "$RUNNER_TEMP/landrun"
      - name: Print post-verification axiom audit
        if: steps.external-inputs.outputs.changed == 'true'
        run: lake build ExternalVerification.AxiomAudit
      - name: Upload external-verification receipt
        if: ${{ always() && steps.external-inputs.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-verification-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/external-verification-receipt.json
          if-no-files-found: error

  first-contact:
    # The published invitation, run the way a stranger runs it: clone it, no
    # Lean, no toolchain, no pinned interpreter. Every other job in this file
    # is ubuntu-latest with a Python it installs itself, so nothing here had
    # ever executed a reader-facing command on macOS or on whatever `python3`
    # a reader happens to have. The reader-facing surfaces are pure Python and
    # the claim is that they need nothing else; this is where that is tested
    # rather than assumed.
    name: First contact without Lean (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the pinned-history gates resolve the formal-source commit
      - name: Report the interpreter a reader would actually use
        run: python3 -VV
      - name: Follow one claim to its source, its receipts, and its limit
        run: |
          python3 scripts/verify_claims.py --claim eb_full_support
          python3 scripts/verify_claims.py --verify-all
      - name: Navigate the corpus with no Lean build
        run: |
          python3 scripts/query_corpus.py --tour --format card
          python3 scripts/check_cold_clone_comprehension.py --quick

  shallow-clone-is-an-environment-problem:
    # `git clone --depth 1` truncates history, and the gates that read pinned
    # commits then report the formal-source commit as absent -- which reads to
    # a newcomer like a claim that does not hold. verify_claims exits 2 and
    # prints the remedy instead of exiting 1. That distinction is only worth
    # stating on the README if something checks it, and a job that cannot be
    # shown failing checks nothing, so this asserts the exact code.
    name: A truncated clone exits 2, never 1
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1 # deliberately truncated: this is the condition under test
      - name: The environment check names the remedy and exits 2
        run: |
          set +e
          output="$(python3 scripts/verify_claims.py 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output" | head -n 3
          echo "exit code: $code"
          test "$code" -eq 2
          printf '%s' "$output" | grep -q 'git fetch --unshallow'
      - name: Following one claim still works on a truncated clone
        run: |
          python3 scripts/verify_claims.py --claim eb_full_support
          python3 scripts/verify_claims.py --verify-all

  release-surfaces:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'release-surfaces-only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # corpus descriptor resolves the pinned proof-source tag
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install metadata validators
        run: pip install cffconvert reuse

      - name: Check newcomer architecture guide
        run: |
          python3 scripts/check_architecture_guide.py
          python3 scripts/check_agent_navigation_paper.py
          python3 scripts/test_architecture_guide.py

      # Every check below is blocking, and every check below reports.  The
      # `!cancelled()` guard exists because release-surface failures are not
      # ordered by severity: a first-contact wording check runs before the
      # proof-trust guard, so a fail-fast job can report a missing README
      # sentence while silently never reaching a `native_decide` violation in
      # the checked source.  That is what happened between 2026-07-13 and
      # 2026-07-16.  Surfacing all failures at once weakens nothing; the job
      # still fails if any single check fails.
      - name: Cross-surface release checks (proof trust, claims, projections)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_release.py
      # Most committed `check_*.py` gates are reached transitively: check_release
      # subprocesses the problem-note, semantic-corpus, theory-lab, and rendered
      # -paper checks, and test_check_release_ref imports the release-ref wrapper.
      # The five below were reached by nothing, so only habit kept them current.
      # check_cold_clone_comprehension is the one that stings: it is the gate
      # that tests the published first-contact promise -- clone this, follow a
      # claim -- and it was the least enforced check in the repository.
      - name: Cold-clone comprehension (guards the published first-contact test)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_cold_clone_comprehension.py
      - name: Test the claim-following verb reports drift
        if: ${{ !cancelled() }}
        run: python3 scripts/test_verify_claims.py
      - name: Publication contract
        if: ${{ !cancelled() }}
        run: python3 scripts/check_publication_contract.py
      - name: Problem-specific frontier checks
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_erdos269_dyadic_windows.py
          python3 scripts/check_farey_denominator_scaling.py
          python3 scripts/check_formal_conjectures_crosswalk.py
      # GitHub renders markdown in a 1012px column and a table has no wrapping
      # escape, so a long declaration name in a cell pushes the table past the
      # column and the reader gets a horizontal scrollbar with every other
      # column squashed.  `<wbr>` and `style` are both stripped by GitHub's
      # sanitiser, so the only fix is structural and the only guard is a check.
      - name: Markdown tables fit the rendered column
        if: ${{ !cancelled() }}
        run: python3 scripts/check_markdown_table_render.py --fail-on overflow .
      # The freshness comparison above is only meaningful if a projection is a
      # pure function of the committed tree.  This job checks `main` out as a
      # local branch and a pull request out as a topic branch, so a builder that
      # consults the refs a checkout carries renders differently in the two and
      # fails one of them with no file having changed.
      - name: Test projections do not depend on the checkout shape
        if: ${{ !cancelled() }}
        run: python3 scripts/test_projection_checkout_independence.py
      - name: Test immutable release source resolution
        if: ${{ !cancelled() }}
        run: python3 scripts/test_release_source_identity.py
      - name: Test clean committed-snapshot release wrapper
        if: ${{ !cancelled() }}
        run: python3 scripts/test_check_release_ref.py
      - name: Test scope source-identity boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/test_scope_source_identity.py
      - name: Test public-artifact boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/test_public_artifact_boundary.py
      - name: Test supported root-import closure
        if: ${{ !cancelled() }}
        run: python3 scripts/test_root_import_closure.py
      - name: Test downstream example claim boundary
        if: ${{ !cancelled() }}
        run: python3 scripts/test_downstream_example_contract.py
      - name: Test adversarial methodology transitions
        if: ${{ !cancelled() }}
        run: python3 scripts/test_methodology_contract.py
      - name: Test publication artifact mutations
        if: ${{ !cancelled() }}
        run: python3 scripts/test_publication_artifact_contract.py
      - name: Test exact claim packet boundaries
        if: ${{ !cancelled() }}
        run: python3 scripts/test_claim_packet_boundaries.py
      - name: Test publication evidence time axis
        if: ${{ !cancelled() }}
        run: python3 scripts/test_publication_evidence_time_axis.py
      # The clone-local paper corpus is generated from the private system
      # repository, so no builder here can refresh it and nothing above notices
      # when it falls behind. It shipped stale from 2026-07-21: the generated
      # full text still omitted the generative-AI disclosure that both
      # manuscripts and both PDFs carried, which is the one drift a reader must
      # not meet. The checker ships in the corpus it guards; run it.
      - name: Test clone-local paper corpus is current
        if: ${{ !cancelled() }}
        run: python3 docs/papers/check_paper_corpus.py
      - name: Test ordinary-language status questions
        if: ${{ !cancelled() }}
