name: Argument continuations

# Export the argument graph of the elaborated corpus: every theorem's
# hypothesis telescope, and for every closed hypothesis the corpus theorems
# whose conclusions unify with it (see scripts/export_argument_continuations.lean).
# The stream is an artifact consumed by scripts/build_argument_continuations.py.
#
# This workflow is not a required check and never saves a cache: it restores
# the main-branch `.lake` that lean-cache-warm.yml maintains, so it cannot
# evict main's entry or be restored by lean.yml.

# A push trigger: its path filter sees only the commits pushed, so a later
# push that leaves the exporter alone does not restart a two-hour export (a
# pull_request path filter sees the whole pull-request diff).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/export_argument_continuations.lean
      - scripts/test_argument_continuation_export.py
      - scripts/coverage_build_targets.py
      - .github/workflows/argument-continuations.yml

concurrency:
  group: argument-continuations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /tmp/plectis-ci-empty.gitconfig
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_NAMESPACE: ""
      GIT_REPLACE_REF_BASE: ""
      GIT_PAGER: cat
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /bin/false
      GIT_TRACE2: ""
      GIT_TRACE2_EVENT: ""
      GIT_TRACE2_PERF: ""
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONSTARTUP: ""
      PYTHONUSERBASE: ""
      PYTHONBREAKPOINT: ""
      PYTHONWARNINGS: ""
      PYTHONOPTIMIZE: ""
      PATH: /usr/local/bin:/usr/bin:/bin
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"

      # Restore only. Same key shape as lean.yml and lean-cache-warm.yml so the
      # newest main entry seeds this run; nothing here writes a cache back.
      # Larger PR caches can evict main's `lake-` cache; main's coverage cache
      # also holds the supported roots.
      - name: Restore project Lean cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
            lake-coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependency build artifacts
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Toy-corpus exporter test
        run: python3 scripts/test_argument_continuation_export.py

      - name: Memory-bounded Lean build of the corpus roots
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness Erdos249257 ErdosProblems

      # Two thirds of the declarations the paper-to-Lean ledger cites live in
      # modules only the coverage build compiles. The export imports those
      # targets too; if they cannot be built or imported together it falls
      # back to the default roots and the stream's meta row says which.
      - name: Memory-bounded Lean build of the coverage targets
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t targets < <(python3 scripts/coverage_build_targets.py)
          python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness "${targets[@]}"

      # Each pass stops itself at its own budget: used consequences 10 min,
      # search 75 min, compositions at most 20 min after the search budget, idle
      # hypotheses 10 min, battery 20 min, library search on the 150
      # most-consumed open leaves 10 min. The outer timeout is a backstop so a stuck elaboration cannot
      # consume the job and lose the partial stream. The builder labels a
      # stream without a summary record as truncated rather than rejecting it.
      # The lean/ tree id lets any checkout tell whether the graph is current
      # without fetching the pull request's merge commit.
      - name: Export the argument graph
        timeout-minutes: 185
        env:
          PLECTIS_CONTINUATION_EXPORT_FILE: ${{ runner.temp }}/argument_continuations_export.jsonl
          PLECTIS_CONTINUATION_TIME_BUDGET_SECONDS: "4500"
          PLECTIS_CONTINUATION_IDLE_SECONDS: "600"
          PLECTIS_CONTINUATION_WEAKEN_SECONDS: "600"
          PLECTIS_CONTINUATION_BATTERY_SECONDS: "1200"
          PLECTIS_CONTINUATION_DEEP_LEAVES: "150"
          PLECTIS_CONTINUATION_DEEP_SECONDS: "600"
        run: |
          set -uo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/argument_continuations_source_revision.txt"
          git rev-parse HEAD:lean > "$RUNNER_TEMP/argument_continuations_lean_tree.txt"
          wrapper="$RUNNER_TEMP/ArgumentContinuationExportWithCoverage.lean"
          {
            head -n 2 scripts/export_argument_continuations.lean
            python3 scripts/coverage_build_targets.py --imports
            tail -n +3 scripts/export_argument_continuations.lean
          } > "$wrapper"
          start=$(date +%s)
          timeout --kill-after=60s 175m lake env lean "$wrapper"
          status=$?
          if [ "$status" -ne 0 ] && [ ! -s "$PLECTIS_CONTINUATION_EXPORT_FILE" ]; then
            echo "the coverage targets did not import (exit $status); exporting the default roots only"
            timeout --kill-after=60s 165m lake env lean scripts/export_argument_continuations.lean
            status=$?
          fi
          end=$(date +%s)
          echo "export exit $status after $((end - start)) seconds"
          tail -n 1 "$PLECTIS_CONTINUATION_EXPORT_FILE" || true
          exit "$status"

      - name: Compress the argument graph
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/argument_continuations_export.jsonl" ]; then
            gzip -9 -f "$RUNNER_TEMP/argument_continuations_export.jsonl"
          fi

      - name: Upload the argument graph artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argument-continuations-${{ github.sha }}
          path: |
            ${{ runner.temp }}/argument_continuations_export.jsonl.gz
            ${{ runner.temp }}/argument_continuations_source_revision.txt
            ${{ runner.temp }}/argument_continuations_lean_tree.txt
          retention-days: 14
          if-no-files-found: warn
