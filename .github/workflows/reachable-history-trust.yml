name: Reachable history trust boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable-history-evidence:
    runs-on: ubuntu-24.04
    # Both the scan and its independent evidence check read the full history.
    timeout-minutes: 90
    env:
      PYTHONPATH: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      LANGUAGE: "C.UTF-8"
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: "/tmp/plectis-ci-empty.gitconfig"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_PAGER: "cat"
      GIT_ASKPASS: "/bin/false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Every reachable blob is inspected; a blobless checkout is slower.
          fetch-tags: true
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.9"
      - name: Exercise deleted-object and redaction fixtures
        run: python3 scripts/test_reachable_release_history_environment.py
      - name: Scan the exact CI checkout and retain redacted evidence
        id: scan
        # A committed report describes an earlier checkout. Comparing it with
        # every later commit makes ordinary source/ref changes permanent CI
        # failures. Scan this checkout instead, without replacing the retained
        # historical report or changing any finding, disposition, ref or tag.
        run: >-
          python3 scripts/audit_reachable_release_history.py --write-report
          --report "$RUNNER_TEMP/reachable-history-audit.json"
      - name: Validate current evidence and enforce the public-clone release gate
        # Recompute and validate the evidence, including remediation context.
        # A prohibited object still fails; freshly generated does not mean safe.
        run: >-
          python3 scripts/test_reachable_release_history.py --check --release-gate
          --report "$RUNNER_TEMP/reachable-history-audit.json"
      - name: Preserve the redacted report even when the release gate fails
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reachable-history-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reachable-history-audit.json
          if-no-files-found: warn
          retention-days: 30
