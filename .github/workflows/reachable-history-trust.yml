name: Reachable history trust boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable-history-evidence:
    runs-on: ubuntu-24.04
    # The scan decompresses every reachable blob (about 9 GiB for this
    # repository) and took 7 minutes locally; the 15-minute cap timed the
    # job out twice on 2026-09-05 once a committed report let it run at all.
    timeout-minutes: 90
    env:
      # Keep history inspection independent of runner-local Python imports,
      # bytecode caches, locale, and Git configuration.
      PYTHONPATH: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"
      LANGUAGE: "C.UTF-8"
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: "/tmp/plectis-ci-empty.gitconfig"
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_PAGER: "cat"
      GIT_ASKPASS: "/bin/false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # No blob filter: the audit reads every reachable blob, and a
          # partial clone fetches them one object at a time, far slower than
          # one full clone.
          fetch-tags: true
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.9"
      - name: Validate redacted reachable-history evidence
        run: python3 scripts/test_reachable_release_history.py --check
      - name: Exercise deleted-object and redaction fixtures
        run: python3 scripts/test_reachable_release_history_environment.py
      - name: Enforce public-clone release gate
        run: python3 scripts/test_reachable_release_history.py --release-gate
