name: Warm the main Lean cache

# `lean.yml` deliberately has no `push` trigger: `build` and `release-surfaces`
# are required checks with strict mode, so main only ever receives commits that
# already passed them, and re-running those jobs after a merge validates
# nothing. `scripts/test_lean_fast_build.py` pins that decision.
#
# The cache is a separate concern from validation. `actions/cache` scopes an
# entry to the ref that saved it: a branch reads its own caches and the default
# branch's, never a sibling's. With nothing running on main, nothing ever saved
# a cache there, and the newest `refs/heads/main` entry was left at 2026-08-03
# while main moved through #71, #76, #77, #78, #79 and #80. Every branch cut
# from main therefore restored a fifteen-day-old `.lake` and paid for it twice:
# on run 32155838033, `Memory-bounded Lean build` took 44 minutes and
# `Verify elaborated dependency index` another 47, for changes that compile in
# seconds against a current `.lake`.
#
# This workflow exists only to leave a fresh `.lake` on main. It runs no
# required check, reports no status a pull request waits on, and is off the
# critical path: a merge is already landed before it starts.

on:
  push:
    branches:
      - main

concurrency:
  group: lean-cache-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same key shape as `lean.yml`, so its prefix `restore-keys` fallback
      # finds what this run saves. Diverging here would silently reintroduce
      # the stale-cache rebuild.
      - name: Restore project Lean cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependency build artifacts
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Memory-bounded Lean build
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness

      - name: Build the problem-centric library
        run: lake build ErdosProblems

      - name: Build foreign-corpus statement adapters
        run: lake build FormalConjecturesAdapter

      - name: Build foreign-corpus variant candidates
        run: lake build FormalConjecturesVariants

      # Writes the exact dependency-index receipt into `.lake`. `lean.yml`
      # reuses it on an exact cache restore; without it in the saved cache the
      # next branch pays the full export again.
      - name: Export elaborated dependency index
        run: python3 scripts/build_lean_dependency_index.py --check
