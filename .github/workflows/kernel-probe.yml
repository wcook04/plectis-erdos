name: Kernel probe

# Check scratch Lean files against the built corpus, for research sessions on
# hosts without a local corpus build. Push `research/probes/*.lean` to a branch
# named `claude/kernel-probe-*` or `codex/kernel-probe-*`; each probe is run
# with `lake env lean` against the two corpus roots and its exit status and
# messages are uploaded as the `kernel-probe-<sha>` artifact.
#
# A probe verdict is a kernel check of that file at that commit and nothing
# more; results that matter move into lean/ through the ordinary landing path.
# Restore-only cache, like argument-continuations.yml, so probes never evict
# main's `.lake`.

on:
  push:
    branches:
      - "claude/kernel-probe-*"
      - "codex/kernel-probe-*"
    paths:
      - "research/probes/**"
      - ".github/workflows/kernel-probe.yml"
  workflow_dispatch:

concurrency:
  group: kernel-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /tmp/plectis-ci-empty.gitconfig
      GIT_OPTIONAL_LOCKS: "0"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_NAMESPACE: ""
      GIT_REPLACE_REF_BASE: ""
      GIT_PAGER: cat
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /bin/false
      GIT_TRACE2: ""
      GIT_TRACE2_EVENT: ""
      GIT_TRACE2_PERF: ""
      PYTHONHOME: ""
      PYTHONPATH: ""
      PYTHONSTARTUP: ""
      PYTHONUSERBASE: ""
      PYTHONBREAKPOINT: ""
      PYTHONWARNINGS: ""
      PYTHONOPTIMIZE: ""
      PATH: /usr/local/bin:/usr/bin:/bin
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.9"
      - name: Restore project Lean cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          installer_dir="$RUNNER_TEMP/elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency build artifacts
        run: lake exe cache get
      - name: Memory-bounded Lean build of the corpus roots
        run: python3 scripts/lean_fast_build.py --jobs 2 --lake-staleness Erdos249257 ErdosProblems
      - name: Run the probes
        run: python3 scripts/run_kernel_probes.py --out "$RUNNER_TEMP/kernel-probe"
      - name: Upload probe verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-probe-${{ github.sha }}
          path: ${{ runner.temp }}/kernel-probe
          retention-days: 14
          if-no-files-found: warn
