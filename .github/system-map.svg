<!-- Editable source for system-map.png. Render at 2x; viewBox 600 x 820.
     Publication palette follows paper/paper-house-style.sty.
     Design grammar: cathrynlavery/diagram-design (MIT), pinned f4547ee9.
     Arrows describe navigation. The enclosing region identifies repository
     contents; neither proximity nor an arrow confers proof or acceptance. -->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="system-map-title system-map-desc">
  <title id="system-map-title">From the maths map to the research record</title>
  <desc id="system-map-desc">Explore a question through the website and maths map, read short papers, longer records, cross-problem or system papers in the repository, then follow their sources to exact statements, limits, selected Lean proofs, finite experiments and preserved attempts.</desc>
  <defs>
    <marker id="system-map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="#275D8C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #25323C; }
      .serif { font-family: Palatino, 'Palatino Linotype', Georgia, serif; }
      .label { font-size: 17px; font-weight: 600; letter-spacing: 1.5px; fill: #275D8C; }
      .heading { font-size: 31px; }
      .body { font-size: 23px; fill: #475965; }
      .route { fill: none; stroke: #275D8C; stroke-width: 1.7; marker-end: url(#system-map-arrow); }
      .rule { stroke: #D2DADF; stroke-width: 1; }
    </style>
  </defs>
  <rect width="600" height="820" rx="8" fill="#FCFCFA"/>
  <text x="28" y="37" class="label">PLECTIS · A READER’S MAP</text>
  <text x="28" y="87" class="serif" font-size="37">Find a question. Follow the work.</text>

  <!-- The website is a reading companion. It points into the repository. -->
  <rect x="28" y="120" width="544" height="112" rx="6" fill="#EAF0F5" stroke="#A6B8C6"/>
  <text x="52" y="163" class="serif heading">Website &amp; maths map</text>
  <text x="52" y="202" class="body">Eight problems and their connections.</text>
  <text x="82" y="272" class="body" style="fill:#275D8C">choose a problem</text>

  <!-- One boundary, two reading depths: papers and their underlying sources. -->
  <rect x="28" y="300" width="544" height="464" rx="6" fill="#FFFFFF" stroke="#A6B8C6"/>
  <rect x="382" y="289" width="170" height="24" fill="#FCFCFA"/>
  <text x="392" y="307" class="label" font-size="15">THE REPOSITORY</text>
  <path d="M 60 232 V 321" class="route"/>
  <text x="52" y="357" class="serif heading">Papers</text>
  <text x="52" y="399" class="body"><tspan font-weight="600" fill="#25323C">Short papers</tspan><tspan dx="5">· selected arguments</tspan></text>
  <text x="52" y="435" class="body"><tspan font-weight="600" fill="#25323C">Longer records</tspan><tspan dx="5">· detailed investigations</tspan></text>
  <text x="52" y="471" class="body"><tspan font-weight="600" fill="#25323C">Cross-problem</tspan><tspan dx="5">· connections &amp; methods</tspan></text>
  <text x="52" y="507" class="body"><tspan font-weight="600" fill="#25323C">System paper</tspan><tspan dx="5">· how the project works</tspan></text>

  <path d="M 60 531 V 590" class="route"/>
  <text x="82" y="563" class="body" style="fill:#275D8C">follow the sources</text>
  <text x="52" y="626" class="serif heading">Research record</text>
  <text x="52" y="666" class="body">Statements, assumptions and limits</text>
  <text x="52" y="702" class="body">Selected Lean proofs · finite experiments</text>
  <text x="52" y="738" class="body">Attempts, failures and open questions</text>

  <text x="28" y="802" class="body" style="fill:#6E2B2B">Continue from a question that remains open.</text>
</svg>
