    sorry_count: 0
    comparator_config: ExternalVerification249ResidueClassTotientSeries/comparator.json
    canonical_claim_status: exact source transport; axiom print pending the first public
      CI run for this entry
    local_proof_provenance: Source declaration in ErdosProblems/Erdos249/ResidueClassTotientSeries.lean.
    novelty_status: unassessed
    contribution_class: quantitative Diophantine separation for bounded binary
      expansions
    statement: For an integer sequence a with |a(n)| ≤ C for every n, a letter t = a(N+1+L)
      with t ≠ 0, vanishing a(N+1+i) for every i ≤ 2L with i ≠ L, a positive integer q
