    contribution_class: arithmetic supply of two-sided isolated totient pulses
    statement: For a natural number m with 2 ≤ m, natural numbers L, N and r with
      gcd(r+1, m) = 1, there is a prime p with N < p and L+1 < p such that φ(p) is
