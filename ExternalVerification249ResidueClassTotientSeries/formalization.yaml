version: v0.4
project:
  name: 'Erdős #249: irrationality of fixed-resolution observables of the totient
    word'
  description: >-
    Fix a natural number m at least 2, an integer-valued letter map f on residues with
    f 0 = 0, and a residue r below m with gcd(r+1, m) = 1 and f r nonzero. The sum over
    all natural numbers n of f(φ(n) mod m) / 2^n is irrational. Six declarations are
    compared. At the dyadic resolutions m = 2^k with k at least 1 the coprimality
    condition is automatic at every even residue, so every integer-valued letter map
    vanishing at the zero residue and nonzero at some even residue below 2^k has
    irrational binary value. Specialising the letter map to the least nonnegative
    residue gives the headline consequence: for every m at least 3 the series A_m,
    the sum over all natural numbers n of (φ(n) mod m) / 2^n, is irrational. Three
    further declarations expose the machinery. The isolated pulse separation is the
    Diophantine core. For an integer sequence a whose terms are bounded in absolute
    value by C, a letter t at position N+1+L with t nonzero and a(N+1+i) = 0 for every
    i at most 2L other than i = L, and a positive integer q with 2qC < 2^L, every
    integer k satisfies q(|t| - C/2^L)/2^(N+1+L) ≤ |qV - k|, where V is the sum over
    all natural numbers n of a(n)/2^n. The packaged consumer of that separation proves
    that a bounded integer sequence carrying, for every L, a nonzero letter flanked by
    L zeros on each side has irrational binary value. The two-sided prime isolation
    supplies those pulses. For m at least 2 and r with gcd(r+1, m) = 1 and any bounds
    L and N there is a prime p exceeding both N and L+1 with φ(p) congruent to r modulo
    m and with m dividing φ(p-j) and φ(p+j) for every j with 0 < j ≤ L. Auxiliary primes
    congruent to 1 modulo m come from Dirichlet's theorem on primes in arithmetic
    progressions, and the Chinese remainder theorem glues them into a single congruence
    class for p. The separation mechanism is the Lambert-series argument of P. Erdős,
    On arithmetical properties of Lambert series, Journal of the Indian Mathematical
    Society 12 (1948); the declarations compared here apply it to the reduced sequences
    φ(n) mod m and no exact prior statement of them has been located. Every compared
    declaration is a statement about a reduced sequence φ(n) mod m or about an abstract
    bounded integer sequence. The value of the series in Erdős Problem 249, the sum over
    n at least 1 of φ(n)/2^n, is the subject of no declaration here, and that problem
    remains open. The converse half of the rational-relation classification for
    rational-valued letter maps and the bit-plane independence corollary are absent from
    this package. The rationality of A_1 and A_2 has no Lean witness in this development,
    so the hypothesis m at least 3 is stated without a sharpness claim.
