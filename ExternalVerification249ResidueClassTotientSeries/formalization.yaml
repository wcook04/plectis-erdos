    novelty_status: unassessed
    contribution_class: number-theory-free irrationality criterion for binary values
    statement: For an integer sequence a with |a(n)| ≤ C for every n, if for every L
      there is a position p with L+1 < p, a(p) ≠ 0, and a(p-j) = a(p+j) = 0 for every j
      with 0 < j ≤ L, then the sum over all natural numbers n of a(n)/2^n is irrational.
    boundary: A criterion about bounded integer sequences. It asserts nothing about any
      particular arithmetic function until pulses are supplied.
    comparator_declaration: Erdos249257.ExternalVerification249ResidueClassTotientSeries.irrational_dyadicValue_of_pulses
    literature_dependencies:
