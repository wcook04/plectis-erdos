    canonical_claim_status: exact source transport; axiom print pending the first public
      CI run for this entry
    local_proof_provenance: Source declaration in ErdosProblems/Erdos249/ResidueClassTotientSeries.lean.
    novelty_status: unassessed
    contribution_class: special-value irrationality for a reduced totient series
    statement: For a natural number k with 1 ≤ k, an integer-valued map f with f 0 = 0,
      and an even residue r < 2^k with f r ≠ 0, the sum over all natural numbers n of
