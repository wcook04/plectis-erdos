version: v0.4
project:
  name: 'Erdős #251: bounded-perturbation countermodel anchored at the actual prime
    gaps'
  description: >-
    For every positive integer M and every natural number K there are digits δ(n) in
    {0, 1}, all zero for n below K, such that the dyadic series over the perturbed
    actual prime gaps, the sum of (g(n) + M δ(n)) / 2^(n+1) with g(n) = p_(n+1) - p_n
    and p_0 = 2, has a value that fails to be irrational. The same digits carry an
    explicit rational r with the sum of (g(n) + M δ(n)) / 2^(n+1) equal to r. Every
    perturbed gap satisfies g(n) ≤ g(n) + M δ(n) ≤ g(n) + M together with
    (g(n) + M δ(n)) mod M = g(n) mod M, so the perturbation raises each gap by at most
    M and preserves every gap modulo M. The mechanism is proved for an arbitrary
    natural-digit dyadic series: if the sum of g(n) / 2^(n+1) is S, then for every
    M ≥ 1, every K, and every real r with S < r < S + M / 2^K there are digits δ(n) in
    {0, 1}, all zero for n below K, with the sum of (g(n) + M δ(n)) / 2^(n+1) equal to
    r. The digit supply is the binary expansion: for 0 ≤ D < 1 the digits
    ⌊2^(n+1) D⌋ - 2⌊2^n D⌋ sum to D against the weights 2^(-(n+1)).
    The five compared declarations are statements about perturbed gap sequences and
    about the binary expansion. They determine no value of the sum of g(n) / 2^(n+1),
    and Erdős Problem 251 is undecided here. The consequence they support is a
    strategy-elimination statement: a hypothesis on a gap sequence that is preserved by
    the replacement of g(n) with g(n) + M δ(n) for digits δ(n) in {0, 1} holds for a
    sequence whose dyadic sum is rational, so that hypothesis cannot imply
    irrationality of the sum, and an irrationality proof must use a property of the
    primes that a bounded additive perturbation destroys. No compared declaration
    formalizes the invariance of any named gap theorem under the perturbation, so the
    coverage of that strategy elimination is outside the Lean witness. Telescoping
    constructions of this species in this neighbourhood were published first by Vjeko
    Kovač, whose April 2026 note refutes the variable-denominator conjecture printed
    under Erdős Problem 251. Priority for the bounded, prime-anchored form recorded
    here is unassessed.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
