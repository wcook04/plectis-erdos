version: "v0.4"

project:
  name: "Erdős #1041: checked kernels for three solved polynomial families"
  description: >-
    Exact checked endpoints underlying the sharp all-degree collinear
    root-diameter theorem, the complete primitive sparse quintic family, and
    translated cubic quotient fibres in every degree 3q with q at least two.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

