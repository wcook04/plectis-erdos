# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Erdős #1049: the Zudilin cone weight is a thirteen-interval indicator on [0,1)"
  description: >-
    The integer weight max 0 (max (floor(14x)+floor(13x)-floor(12x)-floor(15x)) (2 floor(14x)-floor(13x)-floor(15x))) takes only the values zero and one at every real point of the interval from zero to one, and it equals one exactly on an explicit union of thirteen left-closed right-open intervals with denominators 2, 3, 4, 5, 6, 7, 12, 14 and 15. The statement is quantified over every real point, so it is a real-variable theorem rather than a check at sampled points, and the endpoint conventions are the ones printed in the source. The proof partitions the interval at all forty-eight rational breakpoints induced by the denominators 12, 13, 14 and 15, fixes the four floor values on each cell, and decides membership in the support cell by cell. The readers are number theorists working on Lambert series irrationality by the Zudilin cone method. This is one lemma of the rational-base construction; it supplies no irrationality conclusion and it does not settle Erdős Problem 1049.
  authors:
    - "Will Cook"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Will Cook"

