  - title: "Heine's basic transform and a permutation group for q-harmonic series"
    authors: ["Wadim Zudilin"]
    id: "https://doi.org/10.4064/aa111-2-4"
    type: "paper"
    relationship: "background"
    note: "Acta Arith. 111 (2004), no. 2, 153-164. Supplies the (14,12,14;27) linear forms, the step function omega and the thirteen demi-intervals on which J is defined, and the printed constants C_1 = 545.5 and C_0 = 221.30008816... with ratio 2.46497868... at p. 162; that ratio is the integer-base irrationality-exponent bound of its Theorem 1, p. 154. The constants redeclared in this package are those printed values. The paper carries the standing hypothesis p = 1/q in Z minus {0, +-1} and states no rational-base result."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the irrationality of generalized q-logarithm"
    authors: ["Wadim Zudilin"]
    id: "https://arxiv.org/abs/1601.02688"
    type: "paper"
    relationship: "background"
    note: "arXiv:1601.02688; Res. Number Theory 2 (2016), doi 10.1007/s40993-016-0042-x. The remark at the end of its Section 2 announces that the results of that paper extend to non-integer p = r/s, |p| > 1, under an assumption log|r| > c log|s| for a computable c > 0. No value of c is computed there, and the remark is made for the generalized q-logarithm of that paper. This source supplies none of the forms, lemmas or constants redeclared in this package."
    license: "unknown"
    author_endorsement: "not-contacted"
