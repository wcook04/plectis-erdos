version: "v0.4"
project:
  name: "Erdős #1049: the rational-base contour of Zudilin's (14,12,14;27) forms"
  description: >-
    A Mathlib-only interface redeclares the trigamma series, the thirteen interval
    contributions summing to J, the constants C_1 = 1091/2 and C_0 = 266 - (3/pi^2)(225 - J)
    of Zudilin's (14,12,14;27) forms, the rational-base threshold theta* = C_0/C_1, and the
    parameter region of reduced bases a/b with log b / log a < theta*. Six statements are
    checked: the two-sided bound 81/200 < theta* < 1/2, the exclusion of 3/2 from the region,
    the membership of every positive power of 31/4, and the intermediate constants J >= 77.6
    and C_0 > 88371/400. Membership in the region is a statement about parameters. It is the
    hypothesis consumed by the ordinary proof note attached to these forms, which derives
    irrationality of F(a/b) = sum_{m>=1} 1/((a/b)^m - 1) for every reduced base in the region
    from Zudilin's Lemma 7 and the accompanying lemmas. No theorem in this package formalises
    an analytic step of that note and none asserts anything about the arithmetic nature of
    F(a/b), so the package does not solve Erdős Problem 1049; irrationality at 3/2 remains
    open. The direction, the thirteen demi-intervals, the values C_1 = 545.5 and
    C_0 = 221.30008816..., and the ratio C_1/C_0 = 2.46497868... are printed in Zudilin 2004
    (Acta Arith. 111, no. 2, p. 162), where that ratio is the integer-base
    irrationality-exponent bound of its Theorem 1. The constant theta* checked here is the
    reciprocal of that printed ratio. Zudilin 2016 separately announced a rational-base
    extension of the results of that later paper without computing a value. Novelty of the
    explicit rational-base threshold for F is unassessed.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]
